# Codemagic CI/CD - Engelsiz Club
# Use codemagic.yaml (not Workflow Editor).
# Start build -> workflow: ios-testflight (name: iOS TestFlight)
# ASC integration name must be: EngelsizClubASC
#
# Android workflow still references firebase_credentials group (create in UI if needed).
# iOS TestFlight does not require that group: Dart Firebase options are in firebase_options.dart.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - firebase_credentials
    scripts:
      - name: Load Firebase configuration (google-services.json)
        script: |
          #!/usr/bin/env sh
          set -e
          OUT="$CM_BUILD_DIR/android/app/google-services.json"
          if [ -z "${ANDROID_FIREBASE_SECRET:-}" ]; then
            echo "ERROR: ANDROID_FIREBASE_SECRET is not set."
            echo "Codemagic → Environment variables → group 'firebase_credentials'"
            exit 1
          fi
          case "$(printf '%s' "$ANDROID_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
            \{*) printf '%s\n' "$ANDROID_FIREBASE_SECRET" > "$OUT" ;;
            *) echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > "$OUT" ;;
          esac
          test -s "$OUT"
          echo "Wrote google-services.json ($(wc -c < "$OUT") bytes)"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: EngelsizClubASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS App Store Review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: EngelsizClubASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
