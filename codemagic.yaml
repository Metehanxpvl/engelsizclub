          OFFSET=$(only_positive_int "${PROJECT_BUILD_NUMBER:-}")
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=$(only_positive_int "${CM_BUILD_NUMBER:-}")
          fi
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=1
          fi

          MAX=$HARD_FLOOR
          echo "==== CFBundleVersion sources (date-based; Apple CLI is NOT the increment source) ===="
          for _pair in \
            "hard-floor:$HARD_FLOOR" \
            "pubspec:$PUBSPEC_NUMBER" \
            "CM_BUILD_NUMBER:$(only_positive_int "${CM_BUILD_NUMBER:-}")" \
            "PROJECT_BUILD_NUMBER:$(only_positive_int "${PROJECT_BUILD_NUMBER:-}")" \
            "date-utc:$DATE_BN"
          do
            _name=${_pair%%:*}
            _val=${_pair#*:}
            echo "  source: $_name -> $_val"
            if [ "$_val" -gt "$MAX" ] 2>/dev/null; then
              MAX=$_val
            fi
          done

          BUILD_NUMBER=$((MAX + OFFSET))
          echo "==== CFBundleVersion BUILD_NUMBER=$BUILD_NUMBER ===="
          echo "==== date=$DATE_BN offset=$OFFSET max=$MAX pubspec=$VERSION_LINE name=$BUILD_NAME ===="
          echo "==== flutter will be called with --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER ===="

          if [ -n "${CM_ENV:-}" ]; then
            echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
            echo "FLUTTER_BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
            echo "FLUTTER_BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          fi

          echo "==== Code signing identities in keychain ===="
          security find-identity -v -p codesigning || true
          echo "==== export_options.plist ===="
          plutil -p /Users/builder/export_options.plist || true

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
