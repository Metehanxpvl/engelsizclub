# Codemagic CI/CD — Engelsiz Club
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
# iOS signing: https://docs.codemagic.io/yaml-code-signing/signing-ios/
# Firebase: https://docs.codemagic.io/knowledge-firebase/load-firebase-configuration/
#
# Codemagic UI (zorunlu):
# 1) Application → Configuration → Use codemagic.yaml (Workflow Editor değil)
# 2) Start new build → Workflow: "iOS → TestFlight" (workflow id: ios-testflight)
# 3) Team integrations → Developer Portal → App Store Connect API key adı: EngelsizClubASC
# 4) Secret group: firebase_credentials
#    - ANDROID_FIREBASE_SECRET = google-services.json (raw JSON veya base64)
#    - IOS_FIREBASE_SECRET     = GoogleService-Info.plist (raw plist veya base64)
# 5) Code signing: yaml ios_signing (app_store) kullanılır.
#    UI’da Development profile seçme — distribution App Store olmalı.
# 6) Apple Distribution sertifika limiti: max 3. Limit doluysa Codemagic yeni üretemez;
#    developer.apple.com → Certificates’tan eski Distribution sertifikasını revoke et.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - firebase_credentials
    scripts:
      - name: Load Firebase configuration (google-services.json)
        script: |
          #!/usr/bin/env sh
          set -e
          OUT="$CM_BUILD_DIR/android/app/google-services.json"
          if [ -z "${ANDROID_FIREBASE_SECRET:-}" ]; then
            echo "ERROR: ANDROID_FIREBASE_SECRET is not set."
            echo "Codemagic → Environment variables → group 'firebase_credentials'"
            exit 1
          fi
          case "$(printf '%s' "$ANDROID_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
            \{*) printf '%s\n' "$ANDROID_FIREBASE_SECRET" > "$OUT" ;;
            *) echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > "$OUT" ;;
          esac
          test -s "$OUT"
          echo "Wrote google-services.json ($(wc -c < "$OUT") bytes)"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: EngelsizClubASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      # App Store / TestFlight DISTRIBUTION — development certificate KULLANMA
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Load Firebase configuration
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "${ANDROID_FIREBASE_SECRET:-}" ]; then
            OUT_A="$CM_BUILD_DIR/android/app/google-services.json"
            case "$(printf '%s' "$ANDROID_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
              \{*) printf '%s\n' "$ANDROID_FIREBASE_SECRET" > "$OUT_A" ;;
              *) echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > "$OUT_A" ;;
            esac
          fi
          if [ -z "${IOS_FIREBASE_SECRET:-}" ]; then
            echo "ERROR: IOS_FIREBASE_SECRET is not set."
            echo "Codemagic → Environment variables → group 'firebase_credentials'"
            exit 1
          fi
          OUT_I="$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          case "$(printf '%s' "$IOS_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
            \<?*) printf '%s\n' "$IOS_FIREBASE_SECRET" > "$OUT_I" ;;
            *) echo "$IOS_FIREBASE_SECRET" | base64 --decode > "$OUT_I" ;;
          esac
          test -s "$OUT_I"
          echo "Wrote GoogleService-Info.plist ($(wc -c < "$OUT_I") bytes)"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          # Fetches App Store distribution cert + profile via ASC API,
          # then writes Manual signing into the Xcode project.
          xcode-project use-profiles
      - name: Flutter build IPA (App Store distribution)
        script: |
          #!/usr/bin/env sh
          set -e
          # Produces build/ios/ipa/*.ipa (NOT Runner.app.zip)
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          echo "IPA artifacts:"
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)" \
            || { echo "ERROR: No .ipa produced under build/ios/ipa/"; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Uses Team integration EngelsizClubASC — do not hardcode .p8 / key ids
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS → App Store Review
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: EngelsizClubASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Load Firebase configuration
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "${ANDROID_FIREBASE_SECRET:-}" ]; then
            OUT_A="$CM_BUILD_DIR/android/app/google-services.json"
            case "$(printf '%s' "$ANDROID_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
              \{*) printf '%s\n' "$ANDROID_FIREBASE_SECRET" > "$OUT_A" ;;
              *) echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > "$OUT_A" ;;
            esac
          fi
          if [ -z "${IOS_FIREBASE_SECRET:-}" ]; then
            echo "ERROR: IOS_FIREBASE_SECRET is not set."
            exit 1
          fi
          OUT_I="$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
          case "$(printf '%s' "$IOS_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
            \<?*) printf '%s\n' "$IOS_FIREBASE_SECRET" > "$OUT_I" ;;
            *) echo "$IOS_FIREBASE_SECRET" | base64 --decode > "$OUT_I" ;;
          esac
          test -s "$OUT_I"
          echo "Wrote GoogleService-Info.plist ($(wc -c < "$OUT_I") bytes)"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          xcode-project use-profiles
      - name: Flutter build IPA (App Store distribution)
        script: |
          #!/usr/bin/env sh
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)" \
            || { echo "ERROR: No .ipa produced under build/ios/ipa/"; exit 1; }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
