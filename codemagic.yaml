# Codemagic CI/CD - Engelsiz Club
# Use codemagic.yaml (not Workflow Editor).
# Start build -> workflow: ios-testflight (name: iOS TestFlight)
# ASC integration name in Codemagic UI must match below exactly (currently: engelsizclub)
#
# Apple App ID must have Push Notifications enabled, and the App Store profile
# (Codemagic reference: engelsiz_club; name is versioned, e.g. v2/v3/v4 — do
# not hard-code it) must include aps-environment. Do not strip
# ios/Runner/Runner.entitlements.
#
# Android: google-services.json is in the repository (no firebase_credentials group).
# iOS: Dart Firebase options are in firebase_options.dart.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release \
            --split-debug-info=build/app/outputs/symbols
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      # Use only the profile uploaded in Codemagic (reference: engelsiz_club).
      # distribution_type auto-fetch also pulls stale EngelsizClub_AppStore. from Apple.
      # Profile must include Push (aps-environment); App ID Push must stay enabled.
      ios_signing:
        provisioning_profiles:
          - engelsiz_club
        certificates:
          - "EngelsizClub Apple Distribution"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$PROFILE_DIR" ]; then
            echo "==== Provisioning profiles on build machine (before cleanup) ===="
            for f in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$f" ] || continue
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "<unknown>")
              APS=$(security cms -D -i "$f" 2>/dev/null | grep -A1 aps-environment | tail -n 1 | tr -d '[:space:]<>/' || true)
              echo "  ${NAME}  aps-environment=${APS:-missing}"
              case "$NAME" in
                EngelsizClub_AppStore|EngelsizClub_AppStore.)
                  echo "  -> removing stale profile"
                  rm -f "$f"
                  ;;
              esac
            done
          fi
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          SETTINGS="$(xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null || true)"
          echo "$SETTINGS" | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' || true
          TEAM="$(echo "$SETTINGS" | awk -F' = ' '/^[[:space:]]*DEVELOPMENT_TEAM / {print $2; exit}')"
          PROF="$(echo "$SETTINGS" | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ { if ($2 != "") { print $2; exit } }')"
          echo "DEVELOPMENT_TEAM=${TEAM:-<empty>}"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROF:-<empty>}"
          case "$PROF" in
            EngelsizClub_AppStore|EngelsizClub_AppStore.)
              echo "ERROR: Eski provisioning profile hâlâ seçili: '${PROF}'"
              echo "Codemagic → Settings → Code signing identities → engelsiz_club profilini sil,"
              echo "Fetch profiles → current App Store profile → reference: engelsiz_club"
              echo "Apple Developer → Profiles → EngelsizClub_AppStore / EngelsizClub_AppStore. sil"
              exit 1
              ;;
            "")
              echo "ERROR: use-profiles did not apply DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER."
              echo "Apple App ID Push Notifications açık olmalı; engelsiz_club profili aps-environment içermeli."
              exit 1
              ;;
            *)
              echo "OK: using Codemagic-selected profile '${PROF}'"
              ;;
          esac
          if [ -z "${TEAM}" ] || [ -z "${PROF}" ]; then
            echo "ERROR: use-profiles did not apply DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER."
            exit 1
          fi
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          BUILD_NAME=$(echo "$VERSION_LINE" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d+ -f2)
          echo "==== pubspec version: $VERSION_LINE (name=$BUILD_NAME number=$BUILD_NUMBER) ===="
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" -le 61 ]; then
            echo "ERROR: iOS build number must be > 61."
            echo "Select branch release/ios-1.0.66-71 (main is still +61)."
            exit 1
          fi
          echo "==== Code signing identities in keychain ===="
          security find-identity -v -p codesigning || true
          echo "==== export_options.plist ===="
          plutil -p /Users/builder/export_options.plist || true
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --verbose
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== CFBundleVersion inside IPA ===="
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" | plutil -p - | grep -E 'CFBundleVersion|CFBundleShortVersionString' || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS App Store Review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      ios_signing:
        provisioning_profiles:
          - engelsiz_club
        certificates:
          - "EngelsizClub Apple Distribution"
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$PROFILE_DIR" ]; then
            echo "==== Provisioning profiles on build machine (before cleanup) ===="
            for f in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$f" ] || continue
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "<unknown>")
              APS=$(security cms -D -i "$f" 2>/dev/null | grep -A1 aps-environment | tail -n 1 | tr -d '[:space:]<>/' || true)
              echo "  ${NAME}  aps-environment=${APS:-missing}"
              case "$NAME" in
                EngelsizClub_AppStore|EngelsizClub_AppStore.)
                  echo "  -> removing stale profile"
                  rm -f "$f"
                  ;;
              esac
            done
          fi
          xcode-project use-profiles
          SETTINGS="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null || true)"
          PROF="$(echo "$SETTINGS" | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ { if ($2 != "") { print $2; exit } }')"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROF:-<empty>}"
          case "$PROF" in
            EngelsizClub_AppStore|EngelsizClub_AppStore.)
              echo "ERROR: Eski provisioning profile hâlâ seçili: '${PROF}'"
              exit 1
              ;;
            "")
              echo "ERROR: use-profiles did not apply PROVISIONING_PROFILE_SPECIFIER."
              echo "Apple App ID Push Notifications açık olmalı; engelsiz_club profili aps-environment içermeli."
              exit 1
              ;;
            *)
              echo "OK: using Codemagic-selected profile '${PROF}'"
              ;;
          esac
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          BUILD_NAME=$(echo "$VERSION_LINE" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d+ -f2)
          echo "==== pubspec version: $VERSION_LINE (name=$BUILD_NAME number=$BUILD_NUMBER) ===="
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" -le 61 ]; then
            echo "ERROR: iOS build number must be > 61."
            echo "Select branch release/ios-1.0.66-71 (main is still +61)."
            exit 1
          fi
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== CFBundleVersion inside IPA ===="
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" | plutil -p - | grep -E 'CFBundleVersion|CFBundleShortVersionString' || true
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
