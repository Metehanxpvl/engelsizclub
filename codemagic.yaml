# Codemagic CI/CD - Engelsiz Club
# Use codemagic.yaml (not Workflow Editor).
#
# TestFlight (manual): Start new build
#   workflow: ios-testflight  (UI name: iOS TestFlight)
#   branch:   fix/ios-build-113
#   Do not use the old branch release/ios-1.0.66-71.
# App Store review: ios-app-store (UI name: iOS App Store Review)
#
# Bundle ID: com.sakircaykara.engelsizclub
# Apple team: 8532CL4BMS
# App Store ID: 6799422264
#
# ASC integration name in Codemagic UI must match below exactly (currently: engelsizclub).
# That key stores Issuer ID / Key ID / .p8 (APP_STORE_CONNECT_ISSUER_ID,
# APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY).
#
# Apple App ID must have Push Notifications enabled, and the App Store profile
# (Codemagic reference: engelsiz_club; name is versioned, e.g. v2/v3/v4 — do
# not hard-code it) must include aps-environment. Do not strip
# ios/Runner/Runner.entitlements.
#
# iOS BUILD_NUMBER is date-based (not pubspec +20000x). Do not pass
# FLUTTER_BUILD_NUMBER env or CURRENT_PROJECT_VERSION as Flutter argv.
#
# Android: google-services.json is in the repository (no firebase_credentials group).
# iOS: Dart Firebase options are in firebase_options.dart.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release \
            --split-debug-info=build/app/outputs/symbols
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    # Manual start in Codemagic UI (workflow_dispatch equivalent).
    # Optional: uncomment triggering to also run on pushes to the iOS branch.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: 'fix/ios-build-113'
    #       include: true
    #       source: true
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6799422264
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      # Use only the profile uploaded in Codemagic (reference: engelsiz_club).
      # distribution_type auto-fetch also pulls stale EngelsizClub_AppStore. from Apple.
      # Profile must include Push (aps-environment); App ID Push must stay enabled.
      ios_signing:
        provisioning_profiles:
          - engelsiz_club
        certificates:
          - "EngelsizClub Apple Distribution"
    scripts:
      - name: Set date BUILD_NUMBER (CM_ENV)
        script: |
          #!/usr/bin/env sh
          set -e
          # Each Codemagic script is a new shell. export is lost unless written to $CM_ENV.
          # Marketing version from pubspec (e.g. 1.1.8). BUILD_NUMBER is date-based.
          BUILD_NAME=$(awk -F'[ +]' '/^version:/{gsub(/\r/,""); print $2; exit}' pubspec.yaml)
          [ -n "$BUILD_NAME" ] || BUILD_NAME=1.1.8
          DATE_BN=$(date -u +%Y%m%d%H%M)
          OFFSET="${PROJECT_BUILD_NUMBER:-}"
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET="${CM_BUILD_NUMBER:-}" ;;
          esac
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET=1 ;;
          esac
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=1
          fi
          BUILD_NUMBER=$((DATE_BN + OFFSET))
          echo "==== CM_ENV persist BUILD_NUMBER=$BUILD_NUMBER date=$DATE_BN offset=$OFFSET BUILD_NAME=$BUILD_NAME ===="
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          case "$BUILD_NUMBER" in
            200001|140|150|130)
              echo "ERROR: BUILD_NUMBER=$BUILD_NUMBER is a known-used pubspec/TestFlight number."
              exit 1
              ;;
          esac
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$PROFILE_DIR" ]; then
            echo "==== Provisioning profiles on build machine (before cleanup) ===="
            for f in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$f" ] || continue
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "<unknown>")
              echo "  ${NAME}"
              case "$NAME" in
                EngelsizClub_AppStore|EngelsizClub_AppStore.)
                  echo "  -> removing stale profile"
                  rm -f "$f"
                  ;;
              esac
            done
          fi
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || true
          TEAM="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/DEVELOPMENT_TEAM/ {print $2; exit}')"
          PROF="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')"
          echo "DEVELOPMENT_TEAM=${TEAM:-<empty>}"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROF:-<empty>}"
          case "$PROF" in
            EngelsizClub_AppStore|EngelsizClub_AppStore.)
              echo "ERROR: Eski provisioning profile hâlâ seçili: '${PROF}'"
              echo "Codemagic → Settings → Code signing identities → engelsiz_club profilini sil,"
              echo "Fetch profiles → current App Store profile → reference: engelsiz_club"
              echo "Apple Developer → Profiles → EngelsizClub_AppStore / EngelsizClub_AppStore. sil"
              exit 1
              ;;
            *)
              echo "OK: using Codemagic-selected profile '${PROF:-<empty>}'"
              ;;
          esac
          if [ -z "${TEAM}" ] || [ -z "${PROF}" ]; then
            echo "ERROR: use-profiles did not apply DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER."
            exit 1
          fi
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          # Recompute in THIS shell (do not trust env BUILD_NUMBER: Codemagic
          # already exports that name as a small workflow counter).
          # Do not pass FLUTTER_BUILD_NUMBER / CURRENT_PROJECT_VERSION as Flutter argv.
          BUILD_NAME=$(awk -F'[ +]' '/^version:/{gsub(/\r/,""); print $2; exit}' pubspec.yaml)
          [ -n "$BUILD_NAME" ] || BUILD_NAME=1.1.8
          DATE_BN=$(date -u +%Y%m%d%H%M)
          OFFSET="${PROJECT_BUILD_NUMBER:-}"
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET="${CM_BUILD_NUMBER:-}" ;;
          esac
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET=1 ;;
          esac
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=1
          fi
          BUILD_NUMBER=$((DATE_BN + OFFSET))
          echo "==== same-script BUILD_NUMBER=$BUILD_NUMBER date=$DATE_BN offset=$OFFSET BUILD_NAME=$BUILD_NAME ===="
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"

          case "$BUILD_NUMBER" in
            200001|140|150|130)
              echo "ERROR: BUILD_NUMBER=$BUILD_NUMBER is a known-used pubspec/TestFlight number. Refusing to build."
              exit 1
              ;;
          esac

          echo "==== Code signing identities in keychain ===="
          security find-identity -v -p codesigning || true
          echo "==== export_options.plist ===="
          plutil -p /Users/builder/export_options.plist || true
          echo "==== flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER ===="

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== Verifying CFBundleVersion inside IPA: $IPA ===="
          PLIST_DIR=$(mktemp -d)
          unzip -qo "$IPA" "Payload/Runner.app/Info.plist" -d "$PLIST_DIR"
          IPA_VER=$(plutil -extract CFBundleVersion raw "$PLIST_DIR/Payload/Runner.app/Info.plist")
          IPA_NAME=$(plutil -extract CFBundleShortVersionString raw "$PLIST_DIR/Payload/Runner.app/Info.plist")
          echo "==== IPA CFBundleShortVersionString=$IPA_NAME CFBundleVersion=$IPA_VER (expected BUILD_NUMBER=$BUILD_NUMBER) ===="
          if [ -z "$IPA_VER" ] || [ "$IPA_VER" != "$BUILD_NUMBER" ]; then
            echo "ERROR: IPA CFBundleVersion=$IPA_VER does not match BUILD_NUMBER=$BUILD_NUMBER. Refusing to publish."
            exit 1
          fi
          case "$IPA_VER" in
            200001|140|150|130)
              echo "ERROR: IPA CFBundleVersion=$IPA_VER is a known-used pubspec/TestFlight number. Refusing to publish."
              exit 1
              ;;
          esac
          echo "==== IPA CFBundleVersion verified: $IPA_VER (date-like, not pubspec +200001) ===="
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      # Uploads the signed IPA to App Store Connect; TestFlight processing starts.
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS App Store Review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: 6799422264
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      ios_signing:
        provisioning_profiles:
          - engelsiz_club
        certificates:
          - "EngelsizClub Apple Distribution"
    scripts:
      - name: Set date BUILD_NUMBER (CM_ENV)
        script: |
          #!/usr/bin/env sh
          set -e
          # Each Codemagic script is a new shell. export is lost unless written to $CM_ENV.
          # Marketing version from pubspec (e.g. 1.1.8). BUILD_NUMBER is date-based.
          BUILD_NAME=$(awk -F'[ +]' '/^version:/{gsub(/\r/,""); print $2; exit}' pubspec.yaml)
          [ -n "$BUILD_NAME" ] || BUILD_NAME=1.1.8
          DATE_BN=$(date -u +%Y%m%d%H%M)
          OFFSET="${PROJECT_BUILD_NUMBER:-}"
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET="${CM_BUILD_NUMBER:-}" ;;
          esac
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET=1 ;;
          esac
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=1
          fi
          BUILD_NUMBER=$((DATE_BN + OFFSET))
          echo "==== CM_ENV persist BUILD_NUMBER=$BUILD_NUMBER date=$DATE_BN offset=$OFFSET BUILD_NAME=$BUILD_NAME ===="
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"
          case "$BUILD_NUMBER" in
            200001|140|150|130)
              echo "ERROR: BUILD_NUMBER=$BUILD_NUMBER is a known-used pubspec/TestFlight number."
              exit 1
              ;;
          esac
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          if [ -d "$PROFILE_DIR" ]; then
            for f in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$f" ] || continue
              NAME=$(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "")
              case "$NAME" in
                EngelsizClub_AppStore|EngelsizClub_AppStore.) rm -f "$f" ;;
              esac
            done
          fi
          xcode-project use-profiles
          PROF="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')"
          case "$PROF" in
            EngelsizClub_AppStore|EngelsizClub_AppStore.)
              echo "ERROR: Eski provisioning profile hâlâ seçili: '${PROF}'"
              exit 1
              ;;
            "")
              echo "ERROR: use-profiles did not apply PROVISIONING_PROFILE_SPECIFIER."
              exit 1
              ;;
            *)
              echo "OK: using Codemagic-selected profile '${PROF}'"
              ;;
          esac
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          # Recompute in THIS shell (do not trust env BUILD_NUMBER: Codemagic
          # already exports that name as a small workflow counter).
          # Do not pass FLUTTER_BUILD_NUMBER / CURRENT_PROJECT_VERSION as Flutter argv.
          BUILD_NAME=$(awk -F'[ +]' '/^version:/{gsub(/\r/,""); print $2; exit}' pubspec.yaml)
          [ -n "$BUILD_NAME" ] || BUILD_NAME=1.1.8
          DATE_BN=$(date -u +%Y%m%d%H%M)
          OFFSET="${PROJECT_BUILD_NUMBER:-}"
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET="${CM_BUILD_NUMBER:-}" ;;
          esac
          case "$OFFSET" in
            ''|*[!0-9]*) OFFSET=1 ;;
          esac
          if [ "$OFFSET" -le 0 ]; then
            OFFSET=1
          fi
          BUILD_NUMBER=$((DATE_BN + OFFSET))
          echo "==== same-script BUILD_NUMBER=$BUILD_NUMBER date=$DATE_BN offset=$OFFSET BUILD_NAME=$BUILD_NAME ===="
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$CM_ENV"

          case "$BUILD_NUMBER" in
            200001|140|150|130)
              echo "ERROR: BUILD_NUMBER=$BUILD_NUMBER is a known-used pubspec/TestFlight number. Refusing to build."
              exit 1
              ;;
          esac

          echo "==== Code signing identities in keychain ===="
          security find-identity -v -p codesigning || true
          echo "==== export_options.plist ===="
          plutil -p /Users/builder/export_options.plist || true
          echo "==== flutter build ipa --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER ===="

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist

          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== Verifying CFBundleVersion inside IPA: $IPA ===="
          PLIST_DIR=$(mktemp -d)
          unzip -qo "$IPA" "Payload/Runner.app/Info.plist" -d "$PLIST_DIR"
          IPA_VER=$(plutil -extract CFBundleVersion raw "$PLIST_DIR/Payload/Runner.app/Info.plist")
          IPA_NAME=$(plutil -extract CFBundleShortVersionString raw "$PLIST_DIR/Payload/Runner.app/Info.plist")
          echo "==== IPA CFBundleShortVersionString=$IPA_NAME CFBundleVersion=$IPA_VER (expected BUILD_NUMBER=$BUILD_NUMBER) ===="
          if [ -z "$IPA_VER" ] || [ "$IPA_VER" != "$BUILD_NUMBER" ]; then
            echo "ERROR: IPA CFBundleVersion=$IPA_VER does not match BUILD_NUMBER=$BUILD_NUMBER. Refusing to publish."
            exit 1
          fi
          case "$IPA_VER" in
            200001|140|150|130)
              echo "ERROR: IPA CFBundleVersion=$IPA_VER is a known-used pubspec/TestFlight number. Refusing to publish."
              exit 1
              ;;
          esac
          echo "==== IPA CFBundleVersion verified: $IPA_VER (date-like, not pubspec +200001) ===="
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
