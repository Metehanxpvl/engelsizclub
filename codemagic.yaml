# Codemagic CI/CD - Engelsiz Club
# Use codemagic.yaml (not Workflow Editor).
# Start build -> workflow: ios-testflight (name: iOS TestFlight)
# ASC integration name in Codemagic UI must match below exactly (currently: engelsizclub)
#
# Android workflow still references firebase_credentials group (create in UI if needed).
# iOS TestFlight does not require that group: Dart Firebase options are in firebase_options.dart.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - firebase_credentials
    scripts:
      - name: Load Firebase configuration (google-services.json)
        script: |
          #!/usr/bin/env sh
          set -e
          OUT="$CM_BUILD_DIR/android/app/google-services.json"
          if [ -z "${ANDROID_FIREBASE_SECRET:-}" ]; then
            echo "ERROR: ANDROID_FIREBASE_SECRET is not set."
            echo "Codemagic → Environment variables → group 'firebase_credentials'"
            exit 1
          fi
          case "$(printf '%s' "$ANDROID_FIREBASE_SECRET" | sed -e 's/^[[:space:]]*//')" in
            \{*) printf '%s\n' "$ANDROID_FIREBASE_SECRET" > "$OUT" ;;
            *) echo "$ANDROID_FIREBASE_SECRET" | base64 --decode > "$OUT" ;;
          esac
          test -s "$OUT"
          echo "Wrote google-services.json ($(wc -c < "$OUT") bytes)"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          # Apply Codemagic Distribution cert + App Store profile to the Xcode project
          # BEFORE Flutter archives (must run first).
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || true
          TEAM="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/DEVELOPMENT_TEAM/ {print $2; exit}')"
          PROF="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')"
          echo "DEVELOPMENT_TEAM=${TEAM:-<empty>}"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROF:-<empty>}"
          if [ -z "${TEAM}" ] || [ -z "${PROF}" ]; then
            echo "ERROR: use-profiles did not apply DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER."
            echo "Check Codemagic Code signing identities: Apple Distribution cert + App Store profile for com.sakircaykara.engelsizclub"
            exit 1
          fi
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS App Store Review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sakircaykara.engelsizclub
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || true
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
