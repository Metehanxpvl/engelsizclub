# Codemagic CI/CD - Engelsiz Club
# Use codemagic.yaml (not Workflow Editor).
# Start build -> workflow: ios-testflight (name: iOS TestFlight)
# ASC integration name in Codemagic UI must match below exactly (currently: engelsizclub)
#
# Android: google-services.json is in the repository (no firebase_credentials group).
# iOS: Dart Firebase options are in firebase_options.dart.

workflows:
  android-play:
    name: Android → Play (AAB)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      # Reference names must match Codemagic → Team settings → Code signing identities
      ios_signing:
        provisioning_profiles:
          - engelsizclub_appstore_v2
        certificates:
          - engelsizclub_distribution
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          # Apply Codemagic Distribution cert + App Store profile to the Xcode project
          # BEFORE Flutter archives (must run first).
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || true
          TEAM="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/DEVELOPMENT_TEAM/ {print $2; exit}')"
          PROF="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')"
          echo "DEVELOPMENT_TEAM=${TEAM:-<empty>}"
          echo "PROVISIONING_PROFILE_SPECIFIER=${PROF:-<empty>}"
          if [ "$PROF" != "EngelsizClub_AppStore_v2" ]; then
            echo "ERROR: Yanlış provisioning profile: '${PROF:-<empty>}'"
            echo "Beklenen: EngelsizClub_AppStore_v2 (Sign In with Apple + com.sakircaykara.engelsizclub)"
            echo "Codemagic → Team settings → codemagic.yaml settings → Code signing identities:"
            echo "  1) Eski EngelsizClub_AppStore* profillerini sil"
            echo "  2) Fetch profiles → EngelsizClub_AppStore_v2 → reference: engelsizclub_appstore_v2"
            echo "  3) Distribution cert reference: engelsizclub_distribution"
            exit 1
          fi
          if [ -z "${TEAM}" ] || [ -z "${PROF}" ]; then
            echo "ERROR: use-profiles did not apply DEVELOPMENT_TEAM / PROVISIONING_PROFILE_SPECIFIER."
            echo "Check Codemagic Code signing identities: Apple Distribution cert + App Store profile for com.sakircaykara.engelsizclub"
            exit 1
          fi
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          BUILD_NAME=$(echo "$VERSION_LINE" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d+ -f2)
          echo "==== pubspec version: $VERSION_LINE (name=$BUILD_NAME number=$BUILD_NUMBER) ===="
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" -le 61 ]; then
            echo "ERROR: iOS build number must be > 61."
            echo "Select branch release/ios-1.0.66-71 (main is still +61)."
            exit 1
          fi
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== CFBundleVersion inside IPA ===="
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" | plutil -p - | grep -E 'CFBundleVersion|CFBundleShortVersionString' || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-app-store:
    name: iOS App Store Review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: engelsizclub
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--use-old-altool --apple-id 6799422264"
      ios_signing:
        provisioning_profiles:
          - engelsizclub_appstore_v2
        certificates:
          - engelsizclub_distribution
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          #!/usr/bin/env sh
          set -e
          cd ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          #!/usr/bin/env sh
          set -e
          xcode-project use-profiles
          echo "==== Release signing settings after use-profiles ===="
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings 2>/dev/null \
            | grep -E 'CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || true
          PROF="$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')"
          if [ "$PROF" != "EngelsizClub_AppStore_v2" ]; then
            echo "ERROR: Yanlış provisioning profile: '${PROF:-<empty>}' — EngelsizClub_AppStore_v2 bekleniyor."
            exit 1
          fi
      - name: Flutter build IPA
        script: |
          #!/usr/bin/env sh
          set -e
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}')
          BUILD_NAME=$(echo "$VERSION_LINE" | cut -d+ -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d+ -f2)
          echo "==== pubspec version: $VERSION_LINE (name=$BUILD_NAME number=$BUILD_NUMBER) ===="
          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" -le 61 ]; then
            echo "ERROR: iOS build number must be > 61."
            echo "Select branch release/ios-1.0.66-71 (main is still +61)."
            exit 1
          fi
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
          ls -la build/ios/ipa/
          test -n "$(ls -A build/ios/ipa/*.ipa 2>/dev/null)"
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "==== CFBundleVersion inside IPA ===="
          unzip -p "$IPA" "Payload/Runner.app/Info.plist" | plutil -p - | grep -E 'CFBundleVersion|CFBundleShortVersionString' || true
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - sakir.caykara@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
