# GEÇİCİ: telefonda yan yana kurulabilen "EC Test" APK'sı (paket: ...engelsizclub.test).
# Değişiklikler yalnızca test makinesinde yapılır; birleştirmeden önce silinecek.
name: tmp test apk
on:
  push:
    branches:
      - perf/kesfet-onyukleme
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test kimliği (yalnız bu makinede)
        run: |
          sed -i 's/applicationId = "com.sakircaykara.engelsizclub"/applicationId = "com.sakircaykara.engelsizclub.test"/' android/app/build.gradle.kts
          sed -i 's/android:label="Engelsiz Club"/android:label="EC Test"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import json, copy
          p = 'android/app/google-services.json'
          d = json.load(open(p))
          c = copy.deepcopy(d['client'][0])
          c['client_info']['android_client_info']['package_name'] = 'com.sakircaykara.engelsizclub.test'
          d['client'].append(c)
          json.dump(d, open(p, 'w'), indent=2)
          PY
          grep -n applicationId android/app/build.gradle.kts
      - run: flutter pub get
      - name: Build release APK (debug imzalı)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Yayınla (ön sürüm)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk EC-Test-kesfet.apk
          gh release delete kesfet-test --yes --cleanup-tag 2>/dev/null || true
          gh release create kesfet-test EC-Test-kesfet.apk --prerelease --target "${GITHUB_SHA}" --title "EC Test – Keşfet ön yükleme" --notes "Geçici test APK'sı. Mağaza uygulamasının yanına ayrı kurulur."
