name: tmp avm test
on:
  push:
    branches: [fix/etkinlik-toplayici]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r scripts/requirements-avm.txt
          python -m playwright install --with-deps chromium
      - env:
          PYTHONUNBUFFERED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AVM_DEBUG: '1'
          AVM_ONLY_CITIES: 'İstanbul,Ankara,İzmir,Bursa,Antalya'
        run: python scripts/avm_scraper.py --dry-run
