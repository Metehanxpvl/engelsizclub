# AVM çocuk/aile etkinlikleri → public.events + public.etkinlikler
#
# Cron only runs on the default branch (main). workflow_dispatch works on any
# branch that contains this file.
#
# Before the first run:
#   1) Supabase SQL Editor → supabase/events.sql (additive; does not delete rows)
#   2) Repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY
#   3) GitHub → Actions → "Scrape AVM family events" → Run workflow
name: Scrape AVM family events

on:
  schedule:
    # Daily 07:00 Türkiye = 04:00 UTC — Istanbul today/future/ongoing events.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-avm-events
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # ~100 AVM sources: fetch + Gemini per mall. Default job limit is 360m;
    # 90m is enough for a full run with polite delays.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-avm.txt
      - name: Cache source health
        uses: actions/cache@v4
        with:
          path: scripts/events/.health.json
          key: events-source-health
          restore-keys: |
            events-source-health
      - name: Date filter unit tests
        run: python scripts/avm_event_dates_test.py
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('scripts/requirements-avm.txt') }}
      - name: Install scraper deps
        run: |
          pip install -r scripts/requirements-avm.txt
          python -m playwright install --with-deps chromium
      - name: Extra source fixture tests
        run: python scripts/events/test_events.py
      - name: Fetch mall pages → Gemini → Supabase
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "AVM job start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Secret may omit the extra `a` in the project ref; rewrite before python.
          SUPABASE_URL="${SUPABASE_URL//qycrkqwqrysypvqipqn/qycrkqwqrysypvqaipqn}"
          SUPABASE_URL="${SUPABASE_URL//ypvqipqn.supabase.co/ypvqaipqn.supabase.co}"
          export SUPABASE_URL
          python scripts/avm_scraper.py
          python scripts/events/run.py
          echo "AVM job end $(date -u +%Y-%m-%dT%H:%M:%SZ)"
