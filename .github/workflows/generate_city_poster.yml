# Engelsiz Club müze gezi rehberi posteri (Gemini generate_content).
#
# Varsayılan: 81 il, kCityNames / CITIES sırası (Adana → … → Ardahan).
# Tek il: city_name = Gaziantep (veya Antep / İstanbul …).
# Elle: Actions → Generate city museum posters → Run workflow
# Gerekli secret: GEMINI_API_KEY (yoksa AI_API_KEY)
# Repo Settings → Actions → Workflow permissions → Read and write
# (commit + push için contents: write).
name: Generate city museum posters

on:
  workflow_dispatch:
    inputs:
      city_name:
        description: 'Boş / ALL / * = 81 il sırayla. Tek il için örn. Gaziantep'
        required: false
        default: 'ALL'
        type: string

permissions:
  contents: write

concurrency:
  group: city-poster-batch
  cancel-in-progress: false

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python deps
        pip install -U google-genai requests pillow
      - name: Helper tests
        working-directory: scripts
        run: python generate_city_poster_test.py
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate posters
        id: generate
        env:
          PYTHONUNBUFFERED: '1'
          CITY_NAME: ${{ inputs.city_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          POSTER_DELAY_SECONDS: '8'
          POSTER_SKIP_EXISTING: '1'
          POSTER_CHECKPOINT_EVERY: '10'
        run: python scripts/generate_city_poster.py
      - name: Upload poster artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: city-posters
          path: output/
          if-no-files-found: ignore
      - name: Commit and push posters
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from generate_city_poster import write_index, scan_output_posters, CITIES
          posters = scan_output_posters(Path("output"))
          write_index(Path("output"), ok=len(posters), fail=max(0, len(CITIES) - len(posters)), skip=0, total=len(CITIES))
          PY
          git add -A -- output
          if git diff --staged --quiet; then
            echo "Yeni poster yok."
          else
            CITY="${{ inputs.city_name }}"
            if [ -z "$CITY" ] || [ "$CITY" = "ALL" ] || [ "$CITY" = "*" ]; then
              MSG="Add city museum travel posters and output/index.json for Engelsiz Club admin."
            else
              MSG="Add ${CITY} museum travel poster and refresh output/index.json."
            fi
            git commit -m "$MSG"
            git push
          fi
