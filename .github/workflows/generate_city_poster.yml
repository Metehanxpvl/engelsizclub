# Engelsiz Club müze gezi rehberi posteri (Gemini generate_content).
#
# Varsayılan: 81 il, kCityNames / CITIES sırası (Adana → … → Ardahan).
# Tek il: city_name = Gaziantep (veya Antep / İstanbul …).
# Elle: Actions → Generate city museum posters → Run workflow
# Gerekli secret: GEMINI_API_KEY (yoksa AI_API_KEY)
# Repo Settings → Actions → Workflow permissions → Read and write
# (commit + push için contents: write).
name: Generate city museum posters

on:
  workflow_dispatch:
    inputs:
      city_name:
        description: 'Boş / ALL / * = 81 il sırayla. Tek il için örn. Gaziantep'
        required: false
        default: 'ALL'
        type: string

permissions:
  contents: write

concurrency:
  group: city-poster-batch
  cancel-in-progress: false

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -U google-genai requests
      - name: Helper tests
        working-directory: scripts
        run: python generate_city_poster_test.py
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Generate posters
        id: generate
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
          CITY_NAME: ${{ inputs.city_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          POSTER_DELAY_SECONDS: '8'
          POSTER_SKIP_EXISTING: '1'
          POSTER_CHECKPOINT_EVERY: '10'
        run: python scripts/generate_city_poster.py
      - name: Commit and push posters
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output/*.jpg output/*.png output/*.prompt.txt output/.gitkeep || true
          if git diff --staged --quiet; then
            echo "Yeni poster yok."
          else
            CITY="${{ inputs.city_name }}"
            if [ -z "$CITY" ] || [ "$CITY" = "ALL" ] || [ "$CITY" = "*" ]; then
              MSG="Add 81-city museum travel posters for Engelsiz Club gezi rehberi."
            else
              MSG="Add ${CITY} museum travel poster for Engelsiz Club gezi rehberi."
            fi
            git commit -m "$MSG"
            git push
          fi
