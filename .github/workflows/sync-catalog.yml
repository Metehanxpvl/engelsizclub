name: Sync catalog to Supabase

on:
  push:
    branches: [main, master]
    paths:
      - 'content/**'
      - 'tools/sync_catalog.mjs'
      - '.github/workflows/sync-catalog.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upsert content → Supabase
        env:
          # URL must be https://qycrkqwqrysypvqaipqn.supabase.co (must include https://)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Secret may omit the extra `a` in the project ref; rewrite before node.
          SUPABASE_URL="${SUPABASE_URL//qycrkqwqrysypvqipqn/qycrkqwqrysypvqaipqn}"
          SUPABASE_URL="${SUPABASE_URL//ypvqipqn.supabase.co/ypvqaipqn.supabase.co}"
          export SUPABASE_URL
          node tools/sync_catalog.mjs
