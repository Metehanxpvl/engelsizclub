name: tmp analyze
on:
  push:
    branches: [feat/harita-google-kota]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/harita_google_kota.dart lib/features/harita_kontrol/harita_kontrol_screen.dart lib/services/centers_google_places_service.dart lib/services/centers_google_geocode_service.dart lib/main_shell.dart
