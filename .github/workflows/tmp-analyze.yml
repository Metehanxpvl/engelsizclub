name: tmp-analyze
on:
  push:
    branches: ['fix/biliyor-muydunuz']
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main_shell.dart lib/home_page.dart lib/duyuru_store.dart lib/services/broadcast_push_service.dart lib/widgets/admin_did_you_know_sheet.dart lib/widgets/did_you_know_corner.dart
