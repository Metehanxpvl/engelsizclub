name: tmp analyze
on:
  push:
    branches: [feat/kuyruk-kategori-gruplama]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/features/daily_news/admin_daily_news_screen.dart lib/features/useful_opportunities/admin_review_screen.dart
