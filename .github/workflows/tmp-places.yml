name: tmp places test
on:
  push:
    branches: [tmp/places-test]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          key=AIzaSyAHDu7hYJInYdPhrg8i0YdEzgfl0lL502o
          echo "== AUTOCOMPLETE"
          curl -sS -X POST 'https://places.googleapis.com/v1/places:autocomplete' -H 'Content-Type: application/json' -H "X-Goog-Api-Key: $key" -H 'Referer: https://engelsizclub.com/' -d '{"input":"Süleymaniye Camii","languageCode":"tr","includedRegionCodes":["tr"]}' | tr -d '\n' | head -c 500; echo
          echo "== TEXTSEARCH"
          curl -sS -X POST 'https://places.googleapis.com/v1/places:searchText' -H 'Content-Type: application/json' -H "X-Goog-Api-Key: $key" -H 'X-Goog-FieldMask: places.displayName' -H 'Referer: https://engelsizclub.com/' -d '{"textQuery":"Süleymaniye Camii","maxResultCount":1}' | tr -d '\n' | head -c 400; echo
