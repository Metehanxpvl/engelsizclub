# Fırsat / Destek / Hak toplayıcı → public.content_sources → public.useful_content
# (status=pending_review). Kariyer / AVM scraper / FCM / login iş akışlarına dokunmaz.
#
# Gerekli repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GEMINI_API_KEY   (yoksa AI_API_KEY)
# Anahtarları YAML’e yazmayın. Flutter’a koymayın.
#
# Kaynak listesi: supabase/useful_content_sources_tr.sql (SQL Editor → Run).
# Canlı DB’de kapalı .bel.tr ana sayfalar için kısa UPSERT:
#   supabase/useful_content_bel_tr_activate.sql
# Collector: RSS + EYHGM/ORGM/RG + belediye site taraması (haberler/duyurular/ilanlar).
# 81 il valilik: web/valilikler.json — günde ~12 .gov.tr; engelli eğitim/burs/yardım
# duyuruları useful_content pending_review kuyruğuna düşer (SQL satırı yok).
# Ham HTML body yazılmaz. Yayın / FCM yok; admin onaylar.
# Gemini kotası = kelime/potential yedek (pending_review). Tek şehir 500 tüm işi düşürmez.
#
# Cron yalnız default branch’te çalışır.
#   Actions → Useful content collector → Run workflow → branch main
# Cron 07:30 UTC = 10:30 Türkiye. Engelsiz Kariyer (05:00 UTC) ile çakışmaz.
name: Useful content collector

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install collector deps
        working-directory: collectors
        run: npm ci
      - name: Collector unit tests
        working-directory: collectors
        run: npm test
      - name: Collect → pending_review
        working-directory: collectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # Secret may omit the extra `a` in the project ref; rewrite before node.
          SUPABASE_URL="${SUPABASE_URL//qycrkqwqrysypvqipqn/qycrkqwqrysypvqaipqn}"
          SUPABASE_URL="${SUPABASE_URL//ypvqipqn.supabase.co/ypvqaipqn.supabase.co}"
          export SUPABASE_URL
          npm run collect
