# Fırsat / Destek / Hak toplayıcı → public.content_sources RSS → public.useful_content
# (status=pending_review). Kariyer / AVM scraper iş akışlarına dokunmaz.
#
# Gerekli repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   GEMINI_API_KEY   (yoksa AI_API_KEY)
# Anahtarları YAML’e yazmayın. Flutter’a koymayın.
#
# Kaynak listesi: supabase/useful_content_sources_tr.sql (SQL Editor → Run).
# Collector yalnız doğrulanmış RSS/Atom çeker; Bursa genel HTML ve TBB indeks yok.
# Engelli çekirdek süzgeci (isDisabilityOpportunity) zorunlu. Gemini kotası = kayıt yok.
# Yayın / FCM yok.
#
# Cron yalnız default branch’te çalışır.
#   Actions → Useful content collector → Run workflow → branch main
# Cron 07:30 UTC = 10:30 Türkiye. Engelsiz Kariyer (05:00 UTC) ile çakışmaz.
name: Useful content collector

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install collector deps
        working-directory: collectors
        run: npm ci
      - name: Collector unit tests
        working-directory: collectors
        run: npm test
      - name: Collect RSS → pending_review
        working-directory: collectors
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          # Secret may omit the extra `a` in the project ref; rewrite before node.
          SUPABASE_URL="${SUPABASE_URL//qycrkqwqrysypvqipqn/qycrkqwqrysypvqaipqn}"
          SUPABASE_URL="${SUPABASE_URL//ypvqipqn.supabase.co/ypvqaipqn.supabase.co}"
          export SUPABASE_URL
          npm run collect
