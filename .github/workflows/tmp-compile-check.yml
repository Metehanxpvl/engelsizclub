# GEÇİCİ: PR #48 derleme kontrolü. Birleştirmeden önce silinecek.
name: tmp compile check

on:
  push:
    branches:
      - perf/forum-hizli-acilis

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/forum_store.dart lib/pages/forum_page.dart lib/section_editors.dart lib/duyuru_store.dart lib/main_shell.dart
      - name: Build debug APK
        run: flutter build apk --debug
