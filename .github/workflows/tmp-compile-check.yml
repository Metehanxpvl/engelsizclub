# GEÇİCİ: PR #48 derleme kontrolü. Birleştirmeden önce silinecek.
name: tmp compile check

on:
  push:
    branches:
      - perf/forum-hizli-acilis

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib || true
      - name: Build debug APK
        run: |
          sed -i 's/id("com.android.application") version "9.0.1"/id("com.android.application") version "9.1.1"/' android/settings.gradle.kts
          grep -n com.android.application android/settings.gradle.kts
          flutter build apk --debug
