# GEÇİCİ: PR #48 derleme kontrolü. Birleştirmeden önce silinecek.
name: tmp compile check

on:
  push:
    branches:
      - perf/forum-hizli-acilis

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze changed files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build debug APK (Gradle yalnız test makinesinde 9.3.1)
        run: |
          sed -i 's/gradle-9.1.0-all.zip/gradle-9.3.1-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --debug
