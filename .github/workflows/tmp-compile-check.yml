# GEÇİCİ: Keşfet ön yükleme derleme kontrolü. Birleştirmeden önce silinecek.
name: tmp compile check
on:
  push:
    branches:
      - perf/kesfet-onyukleme
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: pubspec.lock diff
        run: git diff pubspec.lock | base64 -w0; echo
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/kesfet
      - name: Build debug APK
        run: flutter build apk --debug
