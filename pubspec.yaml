name: engelsizclub
description: MetoCare — özel gereksinimli kahramanlarımız için rehber
publish_to: "none"
# Play: versionName+versionCode — her AAB yüklemesinde code artır (ör. 1.0.1+2)
version: 1.0.26+27

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.16.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  app_links: ^7.2.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_tts: ^4.2.5
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  in_app_purchase: ^3.2.3
  showcaseview: ^5.1.0
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  reorderable_grid_view: ^2.2.8
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/app_icon_safe.png
  # Adaptive kapalı: tam logo görünsün (sistem maskesinde kırpılmasın)
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - src/imports/119686.png
