<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Engelsiz Club — özel gereksinimli kahramanlarımız için rehber, kartlar, merkezler ve haklar.">
  <meta name="theme-color" content="#1A6B4A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Engelsiz Club">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Engelsiz Club</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #1A6B4A;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
      transition: opacity .25s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #fff;
      object-fit: contain;
    }
    #loading .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    #loading .hint {
      font-size: 13px;
      opacity: .85;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="Engelsiz Club">
    <div class="title">Engelsiz Club</div>
    <div class="hint">Yükleniyor…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    // Eski / bozuk service worker mobil boş ekranına yol açabiliyor.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    }
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!-- Firebase JS — FlutterFire pigeon kanalı için önce yüklenir -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script>
    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp({
        apiKey: 'AIzaSyDbcRvVaEQSDQJ2y-0kHZUsxtW_O2Xb_bQ',
        authDomain: 'engelsizclub.com',
        projectId: 'engelsizclub-e5842',
        storageBucket: 'engelsizclub-e5842.firebasestorage.app',
        messagingSenderId: '59695056324',
        appId: '1:59695056324:web:ea6c93f11bd19d395b9091',
        measurementId: 'G-8YPB15NZPJ'
      });
    }
    function __engelsizExtractGoogleTokens(result) {
      var idToken = null;
      var accessToken = null;
      try {
        var oauth = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
        if (oauth) {
          idToken = oauth.idToken || null;
          accessToken = oauth.accessToken || null;
        }
      } catch (_) {}
      if (!idToken && result && result.credential) {
        idToken = result.credential.idToken || idToken;
        accessToken = result.credential.accessToken || accessToken;
      }
      var tr = (result && result._tokenResponse) || {};
      if (!idToken) idToken = tr.oauthIdToken || tr.idToken || null;
      if (!accessToken) accessToken = tr.oauthAccessToken || accessToken;
      return { idToken: idToken, accessToken: accessToken };
    }

    // Popup engellenince redirect dönüşünü Flutter yakalar
    window.__engelsizGoogleRedirectResult = async function () {
      if (typeof firebase === 'undefined' || !firebase.apps.length) {
        return { empty: true };
      }
      try {
        var result = await firebase.auth().getRedirectResult();
        if (!result || !result.user) return { empty: true };
        var t = __engelsizExtractGoogleTokens(result);
        if (!t.idToken) {
          return { error: 'Google kimlik jetonu alınamadı (redirect).' };
        }
        return {
          idToken: String(t.idToken),
          accessToken: t.accessToken ? String(t.accessToken) : null
        };
      } catch (e) {
        return { error: (e && e.message) ? String(e.message) : String(e) };
      }
    };

    // Flutter → Google popup (supabase.co yok)
    window.__engelsizGoogleSignIn = async function () {
      if (typeof firebase === 'undefined' || !firebase.apps.length) {
        return { error: 'Firebase yüklenemedi. Sayfayı yenileyin.' };
      }
      var auth = firebase.auth();
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.addScope('openid');
      provider.addScope('email');
      provider.addScope('profile');
      provider.setCustomParameters({ prompt: 'select_account' });
      try {
        // Eski oturum credential’ı boş bırakabiliyor — önce çıkış
        try { await auth.signOut(); } catch (_) {}

        var result = await auth.signInWithPopup(provider);
        var t = __engelsizExtractGoogleTokens(result);

        if (!t.idToken) {
          return {
            error: 'Google kimlik jetonu boş geldi. Firebase Console → Authentication → Sign-in method → Google’ı Enable yapın ve kaydedin.'
          };
        }
        return {
          idToken: String(t.idToken),
          accessToken: t.accessToken ? String(t.accessToken) : null
        };
      } catch (e) {
        var code = (e && e.code) ? String(e.code) : '';
        var msg = (e && e.message) ? String(e.message) : String(e);
        if (code.indexOf('popup-closed') >= 0 || code.indexOf('cancelled') >= 0) {
          return { cancelled: true };
        }
        if (code.indexOf('popup-blocked') >= 0) {
          await auth.signInWithRedirect(provider);
          return { redirecting: true };
        }
        if (code.indexOf('operation-not-allowed') >= 0 || code.indexOf('auth/operation-not-allowed') >= 0) {
          return {
            error: 'Firebase’de Google girişi kapalı. Console → Authentication → Sign-in method → Google → Enable.'
          };
        }
        if (code.indexOf('unauthorized-domain') >= 0) {
          return {
            error: 'Domain yetkisiz. Firebase → Authentication → Settings → Authorized domains: engelsizclub.com ve engelsizclub-e5842.web.app ekleyin.'
          };
        }
        if (msg.toLowerCase().indexOf('redirect_uri') >= 0 || code.indexOf('invalid-login') >= 0) {
          return {
            error: 'Google redirect URI uyuşmuyor. Web client’a ekleyin: https://engelsizclub.com/__/auth/handler'
          };
        }
        return { error: msg };
      }
    };
  </script>
  <!-- Google Maps JavaScript API (Merkezler haritası) -->
  <script>
    window.__GM_AUTH_FAILURE__ = false;
    window.gm_authFailure = function () {
      window.__GM_AUTH_FAILURE__ = true;
    };
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHDu7hYJInYdPhrg8i0YdEzgfl0lL502o&language=tr&region=TR&loading=async"

</body>
</html>
