<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Engelsiz Club — özel gereksinimli kahramanlarımız için rehber, kartlar, merkezler ve haklar.">
  <meta name="theme-color" content="#1A6B4A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Engelsiz Club">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Engelsiz Club</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #1A6B4A;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
      transition: opacity .25s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #fff;
      object-fit: contain;
    }
    #loading .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    #loading .hint {
      font-size: 13px;
      opacity: .85;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="Engelsiz Club">
    <div class="title">Engelsiz Club</div>
    <div class="hint">Yükleniyor…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    // Eski / bozuk service worker mobil boş ekranına yol açabiliyor.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    }
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
