<html lang="tr">
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Engelsiz Club — özel gereksinimli kahramanlarımız için rehber, kartlar, merkezler ve haklar.">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #1A6B4A;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    flutter-view, flt-glass-pane {
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      z-index: 9999;
      transition: opacity .25s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #fff;
      object-fit: contain;
    }
    #loading .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    #loading .hint {
      font-size: 13px;
      opacity: .85;
    }
    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img class="logo" src="icons/Icon-192.png" alt="Engelsiz Club">
    <div class="title">Engelsiz Club</div>
    <div class="hint">Yükleniyor…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    // iPhone Safari: 100vh araç çubuğunu kapsar; Flutter canvas ~0.33px'e çökebilir.
    (function () {
      function flutterCanvases() {
        var out = [];
        function walk(root) {
          if (!root || !root.querySelectorAll) return;
          var list = root.querySelectorAll('canvas');
          for (var i = 0; i < list.length; i++) out.push(list[i]);
          var all = root.querySelectorAll('*');
          for (var j = 0; j < all.length; j++) {
            if (all[j].shadowRoot) walk(all[j].shadowRoot);
          }
        }
        walk(document);
        return out;
      }
      function applyViewportHeight() {
        var vv = window.visualViewport;
        var h = (vv && vv.height) ? vv.height : window.innerHeight;
        var w = (vv && vv.width) ? vv.width : window.innerWidth;
        if (!h || !w) return;
        document.documentElement.style.height = h + 'px';
        document.body.style.height = h + 'px';
        document.documentElement.style.width = w + 'px';
        document.body.style.width = w + 'px';
        var pane = document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane');
        if (pane) {
          pane.style.height = h + 'px';
          pane.style.width = w + 'px';
          pane.style.minHeight = h + 'px';
          pane.style.minWidth = w + 'px';
        }
        var canvases = flutterCanvases();
        for (var i = 0; i < canvases.length; i++) {
          var c = canvases[i];
          var rect = c.getBoundingClientRect();
          if (rect.width < 8 || rect.height < 8) {
            c.style.width = w + 'px';
            c.style.height = h + 'px';
          }
        }
      }
      applyViewportHeight();
      window.addEventListener('resize', applyViewportHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', applyViewportHeight);
        window.visualViewport.addEventListener('scroll', applyViewportHeight);
      }
      var mo = null;
      var moTimer = null;
      if (window.MutationObserver) {
        mo = new MutationObserver(function () {
          if (moTimer) return;
          moTimer = setTimeout(function () {
            moTimer = null;
            applyViewportHeight();
          }, 80);
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      }
      window.__engelsizFitViewport = applyViewportHeight;
      window.__engelsizStopFitObserver = function () {
        if (mo) {
          mo.disconnect();
          mo = null;
        }
      };
    })();

    function __engelsizHideLoading() {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hidden');
      el.style.pointerEvents = 'none';
      setTimeout(function () { if (el && el.parentNode) el.remove(); }, 300);
    }

    function __engelsizShowLoadHint(text, showRetry) {
      var el = document.getElementById('loading');
      if (!el || el.classList.contains('hidden')) return;
      var hint = el.querySelector('.hint');
      if (!hint) return;
      if (showRetry) {
        hint.innerHTML = text +
          ' <a href="' + location.href + '" style="color:#fff;text-decoration:underline">Yenile</a>';
      } else {
        hint.textContent = text;
      }
    }

    // Eski / bozuk service worker mobil boş ekranına yol açabiliyor.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () {});
      }
    }
    window.addEventListener('flutter-first-frame', function () {
      if (window.__engelsizFitViewport) window.__engelsizFitViewport();
      if (window.__engelsizStopFitObserver) window.__engelsizStopFitObserver();
      __engelsizHideLoading();
    });
    // Overlay'i 8 sn'de kaldırma: Safari'de 7 MB CanvasKit bitmeden yeşil boş sayfa kalır.
    setTimeout(function () {
      __engelsizShowLoadHint('Hâlâ yükleniyor… yavaş ağda biraz sürebilir.', false);
    }, 8000);
    setTimeout(function () {
      __engelsizShowLoadHint(
        'Açılmazsa Safari’de Geçmiş ve Website Verilerini Silin, sonra yenileyin.',
        true
      );
    }, 25000);
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Firebase JS — FCM / diğer web yardımcıları -->
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script>
    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
      firebase.initializeApp({
        apiKey: 'AIzaSyDbcRvVaEQSDQJ2y-0kHZUsxtW_O2Xb_bQ',
        authDomain: 'engelsizclub.com',
        projectId: 'engelsizclub-e5842',
        storageBucket: 'engelsizclub-e5842.firebasestorage.app',
        messagingSenderId: '59695056324',
        appId: '1:59695056324:web:ea6c93f11bd19d395b9091',
        measurementId: 'G-8YPB15NZPJ'
      });
    }
    // Google Identity Services — Firebase userinfo 401’i atlanır, id_token doğrudan Supabase’e gider.
    var ENGELSIZ_GOOGLE_CLIENT_ID =
      '59695056324-3dk4r1lsht7n5agn811vjj9777l0qdce.apps.googleusercontent.com';

    function __engelsizPackTokens(idToken, accessToken) {
      if (!idToken) return null;
      return {
        idToken: String(idToken),
        accessToken: accessToken ? String(accessToken) : null
      };
    }

    function __engelsizReadStoredGoogleTokens() {
      try {
        var raw = sessionStorage.getItem('engelsiz_google_tokens');
        if (!raw) return null;
        sessionStorage.removeItem('engelsiz_google_tokens');
        var t = JSON.parse(raw);
        if (t && t.idToken) return __engelsizPackTokens(t.idToken, t.accessToken);
        if (t && t.error) return { error: String(t.error) };
      } catch (_) {}
      return null;
    }

    function __engelsizWaitGoogle(ms) {
      ms = ms || 8000;
      return new Promise(function (resolve, reject) {
        function ready() {
          return window.google && google.accounts && google.accounts.id;
        }
        if (ready()) {
          resolve();
          return;
        }
        var started = Date.now();
        var id = setInterval(function () {
          if (ready()) {
            clearInterval(id);
            resolve();
          } else if (Date.now() - started > ms) {
            clearInterval(id);
            reject(new Error('Google giriş kütüphanesi yüklenemedi. Sayfayı yenileyin.'));
          }
        }, 40);
      });
    }

    function __engelsizRemoveGoogleOverlay() {
      var el = document.getElementById('engelsiz-google-overlay');
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function __engelsizShowGoogleOverlay(onCancel) {
      __engelsizRemoveGoogleOverlay();
      var overlay = document.createElement('div');
      overlay.id = 'engelsiz-google-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-label', 'Google ile giriş');
      overlay.style.cssText =
        'position:fixed;inset:0;z-index:2147483646;background:rgba(15,61,46,.78);' +
        'display:flex;align-items:center;justify-content:center;padding:24px;';
      overlay.innerHTML =
        '<div style="background:#fff;color:#0f3d2e;border-radius:16px;padding:24px 22px 20px;' +
        'max-width:360px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.28);' +
        'font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
        '<div style="font-weight:800;font-size:18px;margin-bottom:6px">Google ile giriş</div>' +
        '<div style="opacity:.75;font-size:14px;margin-bottom:18px;line-height:1.4">' +
        'Google hesabınızı seçerek devam edin.</div>' +
        '<div id="engelsiz-gis-btn" style="display:flex;justify-content:center"></div>' +
        '<button type="button" id="engelsiz-gis-cancel" style="margin-top:16px;background:transparent;' +
        'border:0;color:#0f3d2e;opacity:.7;font-size:14px;cursor:pointer;text-decoration:underline">' +
        'Vazgeç</button></div>';
      overlay.addEventListener('click', function (ev) {
        if (ev.target === overlay && onCancel) onCancel();
      });
      document.body.appendChild(overlay);
      var cancel = document.getElementById('engelsiz-gis-cancel');
      if (cancel) cancel.onclick = function () { if (onCancel) onCancel(); };
      try {
        google.accounts.id.renderButton(document.getElementById('engelsiz-gis-btn'), {
          type: 'standard',
          theme: 'outline',
          size: 'large',
          text: 'signin_with',
          shape: 'pill',
          logo_alignment: 'left',
          locale: 'tr',
          width: 280
        });
      } catch (e) {
        var host = document.getElementById('engelsiz-gis-btn');
        if (host) host.textContent = 'Google butonu yüklenemedi. Sayfayı yenileyin.';
      }
    }

    window.__engelsizGoogleRedirectResult = async function () {
      var stored = __engelsizReadStoredGoogleTokens();
      if (stored) return stored;
      return { empty: true };
    };

    window.__engelsizGoogleSignIn = async function () {
      var stored = __engelsizReadStoredGoogleTokens();
      if (stored && stored.idToken) return stored;

      try {
        await __engelsizWaitGoogle(8000);
      } catch (e) {
        return { error: (e && e.message) ? e.message : String(e) };
      }

      return new Promise(function (resolve) {
        var settled = false;
        function finish(v) {
          if (settled) return;
          settled = true;
          __engelsizRemoveGoogleOverlay();
          resolve(v);
        }

        try { google.accounts.id.cancel(); } catch (_) {}

        google.accounts.id.initialize({
          client_id: ENGELSIZ_GOOGLE_CLIENT_ID,
          callback: function (response) {
            if (response && response.credential) {
              finish(__engelsizPackTokens(response.credential, null));
            } else {
              finish({ error: 'Google kimlik jetonu alınamadı.' });
            }
          },
          auto_select: false,
          cancel_on_tap_outside: true,
          context: 'signin',
          ux_mode: 'popup',
          itp_support: true,
          use_fedcm_for_prompt: true
        });

        var promptVisible = false;
        function showChooser() {
          if (settled || promptVisible || document.getElementById('engelsiz-google-overlay')) return;
          __engelsizShowGoogleOverlay(function () {
            finish({ cancelled: true });
          });
        }

        try {
          google.accounts.id.prompt(function (notification) {
            if (settled) return;
            try {
              if (notification.isDisplayMoment && notification.isDisplayMoment()) {
                promptVisible = true;
                return;
              }
              promptVisible = false;
              if (notification.isNotDisplayed() ||
                  notification.isSkippedMoment() ||
                  notification.isDismissedMoment()) {
                showChooser();
              }
            } catch (_) {
              showChooser();
            }
          });
        } catch (_) {
          showChooser();
        }

        setTimeout(function () {
          if (!promptVisible) showChooser();
        }, 1200);
      });
    };
  </script>
