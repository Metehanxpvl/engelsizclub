<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Fotoğraflı Puzzle - Engelsiz Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: "#22c55e" } } } };
  </script>
  <style>
    html, body { background: #fff; }
    /* Tailwind preflight sets img{max-width:100%} which boxed each
       jigsaw into its cell so tabs never overlapped — that was the gap. */
    #boardWrap {
      background: #d9d0ea;
      padding: 10%;
      overflow: visible;
    }
    #board {
      display: block;
      position: relative;
      gap: 0;
      padding: 0;
      margin: 0;
      overflow: visible;
      aspect-ratio: 1;
      min-width: 0;
    }
    .board-grid {
      display: grid;
      gap: 0;
      padding: 0;
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .piece-layer {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
    }
    .slot {
      position: relative;
      overflow: visible;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: rgba(255, 255, 255, 0.18);
      padding: 0;
      margin: 0;
      border: none;
      min-width: 0;
      min-height: 0;
    }
    .slot.filled { background: transparent; cursor: grab; }
    .slot.snap-lock img.piece,
    img.piece.snap-lock {
      animation: piece-snap 0.2s ease-out;
    }
    @keyframes piece-snap {
      0% { filter: brightness(1.1); }
      100% { filter: none; }
    }
    .slot.grouped { z-index: 3; }
    .slot.grouped img.piece {
      filter: drop-shadow(0 0 0.6px rgba(34, 197, 94, 0.4));
    }
    .slot.drop-target {
      background: rgba(34, 197, 94, 0.14);
      box-shadow: inset 0 0 0 2px #22c55e;
    }
    .slot img.piece,
    #board > img.piece {
      position: absolute;
      pointer-events: none;
      max-width: none !important;
      max-height: none !important;
      margin: 0;
      padding: 0;
      border: none;
    }
    .slot img.piece {
      width: calc(100% * (1 + 2 * var(--tabx, 0.22)));
      height: calc(100% * (1 + 2 * var(--taby, 0.22)));
      left: calc(-100% * var(--tabx, 0.22));
      top: calc(-100% * var(--taby, 0.22));
    }
    img.piece, .tray-piece, .ghost img {
      max-width: none !important;
      max-height: none !important;
    }
    #trayWrap {
      background: #f3eef9;
      border: 2px dashed #c4b5e0;
      min-height: 140px;
      overflow: visible;
    }
    #tray {
      position: relative;
      width: 100%;
      min-height: 140px;
      touch-action: none;
    }
    .tray-piece {
      position: absolute;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      filter: drop-shadow(2px 8px 10px rgba(0, 0, 0, .38));
    }
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 80;
    }
    .ghost img {
      position: absolute;
      filter: drop-shadow(3px 12px 16px rgba(0, 0, 0, .42));
    }
    .photo-pick {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border-radius: 1rem;
      background: #22c55e;
      color: #fff;
      font-size: 1.125rem;
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
      cursor: pointer;
      overflow: hidden;
    }
    .photo-pick span {
      pointer-events: none;
      position: relative;
      z-index: 1;
    }
    /* Android WebView: keep input in layout (not display:none). Large font-size
       so the native file button fills the label; opacity > 0 so clicks register. */
    .photo-pick input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.01;
      font-size: 48px;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-slate-800">
  <div class="max-w-md mx-auto px-3 pt-4 pb-10">
    <h1 class="text-center text-[1.35rem] sm:text-2xl font-extrabold text-brand leading-tight">Fotoğraflı Puzzle - Engelsiz Club</h1>
    <p class="text-center text-sm text-slate-500 mt-1 mb-4">Fotoğrafını seç, karıştır, parçaları doğru yerlere kilitle.</p>

    <div id="setup" class="space-y-3">
      <label for="file" class="photo-pick">
        <span>Fotoğraf Seç / Çek</span>
        <input id="file" type="file" accept="image/*" />
      </label>
      <p id="photoHint" class="text-center text-sm text-slate-500 hidden">Fotoğraf hazır. Parça sayısını seç.</p>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" data-n="4" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">4 Parça</button>
        <button type="button" data-n="9" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">9 Parça</button>
        <button type="button" data-n="12" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">12 Parça</button>
        <button type="button" data-n="16" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">16 Parça</button>
        <button type="button" data-n="20" class="piece-btn col-span-2 min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">20 Parça</button>
      </div>
    </div>

    <div id="game" class="hidden">
      <div class="flex gap-2 mb-3">
        <button id="helpBtn" type="button" class="flex-1 min-h-[48px] rounded-2xl bg-brand text-white font-extrabold hidden">Yardım Göster</button>
        <button id="resetBtn" type="button" class="flex-1 min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold">Yeni Fotoğraf</button>
      </div>
      <button id="shuffleBtn" type="button" class="w-full min-h-[52px] rounded-2xl bg-brand text-white text-lg font-extrabold shadow-sm mb-3">Fotoğrafı karıştır</button>
      <p id="playHint" class="hidden text-center text-xs text-slate-500 mb-2">Parçaları sürükle; doğru yerde ve komşularına kilitlenir</p>
      <div id="trayWrap" class="relative mx-auto w-full max-w-[360px] rounded-2xl mb-3 hidden">
        <div id="tray"></div>
      </div>
      <div id="boardWrap" class="relative mx-auto w-full max-w-[360px] rounded-2xl border-2 border-brand">
        <div id="board" class="relative w-full"></div>
        <img id="helpImg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40 hidden pointer-events-none z-10" />
      </div>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 hidden z-40 px-4 py-3 rounded-2xl bg-slate-800 text-white font-bold text-sm shadow-lg"></div>

  <div id="win" class="fixed inset-0 hidden z-50 bg-black/50 items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-xl">
      <p class="text-3xl font-black text-brand">Harikasın! 🎉</p>
      <p class="mt-2 text-slate-600 font-semibold">Tüm parçalar yerine oturdu.</p>
      <button id="winOk" type="button" class="mt-5 w-full min-h-[48px] rounded-2xl bg-brand text-white font-extrabold">Tamam</button>
    </div>
  </div>

  <script>
    const LAYOUT = { 4: [2, 2], 9: [3, 3], 12: [3, 4], 16: [4, 4], 20: [4, 5] };
    const fileInput = document.getElementById("file");
    const photoHint = document.getElementById("photoHint");
    const playHint = document.getElementById("playHint");
    const setup = document.getElementById("setup");
    const game = document.getElementById("game");
    const board = document.getElementById("board");
    const tray = document.getElementById("tray");
    const trayWrap = document.getElementById("trayWrap");
    const helpImg = document.getElementById("helpImg");
    const helpBtn = document.getElementById("helpBtn");
    const resetBtn = document.getElementById("resetBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const toast = document.getElementById("toast");
    const win = document.getElementById("win");

    let photoUrl = "";
    let sourceImg = null;
    let catalog = [];
    let boardSlots = [];
    let trayIds = [];
    let parent = [];
    let groupPos = {};
    let rows = 2;
    let cols = 2;
    let tabFracX = 0.2;
    let tabFracY = 0.2;
    let phase = "setup";
    let helpOn = false;
    let ghost = null;
    let won = false;
    let loadGen = 0;
    let dragging = null;
    let zTop = 2;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    function gridFor(n) {
      if (LAYOUT[n]) return LAYOUT[n];
      let bestR = 2;
      let bestC = Math.max(2, Math.ceil(n / 2));
      let bestScore = Infinity;
      for (let r = 2; r <= Math.floor(n / 2); r++) {
        if (n % r !== 0) continue;
        const c = n / r;
        if (c < 2) continue;
        const score = Math.abs(r - c);
        if (score < bestScore) {
          bestScore = score;
          bestR = Math.min(r, c);
          bestC = Math.max(r, c);
        }
      }
      return [Math.max(2, bestR), Math.max(2, bestC)];
    }

    function rcOf(slot) {
      return { r: Math.floor(slot / cols), c: slot % cols };
    }

    // Row-major: left/right are i-1 / i+1 on the SAME row; up/down are i-cols / i+cols.
    function neighborIndex(index, dr, dc) {
      const r = Math.floor(index / cols);
      const c = index % cols;
      const nr = r + dr;
      const nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) return -1;
      return nr * cols + nc;
    }

    function neighborIdsOf(id) {
      const i = catalog[id].correct;
      const out = [];
      [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dr, dc]) => {
        const ni = neighborIndex(i, dr, dc);
        if (ni >= 0) out.push(ni);
      });
      return out;
    }

    function find(i) {
      while (parent[i] !== i) {
        parent[i] = parent[parent[i]];
        i = parent[i];
      }
      return i;
    }

    function union(a, b) {
      const ra = find(a);
      const rb = find(b);
      if (ra === rb) return ra;
      parent[rb] = ra;
      if (groupPos[rb] && !groupPos[ra]) groupPos[ra] = groupPos[rb];
      delete groupPos[rb];
      return ra;
    }

    function membersOf(id) {
      const root = find(id);
      const out = [];
      for (let i = 0; i < catalog.length; i++) if (find(i) === root) out.push(i);
      return out;
    }

    function trayMembers(id) {
      return membersOf(id).filter((i) => trayIds.indexOf(i) >= 0);
    }

    function resetGroups() {
      parent = catalog.map((_, i) => i);
      groupPos = {};
    }

    function areNeighbors(a, b) {
      return neighborIdsOf(a).indexOf(catalog[b].correct) >= 0;
    }

    function slotOf(id) {
      return boardSlots.indexOf(id);
    }

    function movingSet(grabbedId) {
      const s = {};
      membersOf(grabbedId).forEach((pid) => { s[pid] = true; });
      return s;
    }

    // True when two board slots are orthogonally adjacent AND those slots
    // match the pieces' real left/right (same row) or up/down offset.
    function areCorrectlyAdjacentOnBoard(idA, slotA, idB, slotB) {
      if (slotA < 0 || slotB < 0 || idA == null || idB == null) return false;
      const sa = rcOf(slotA);
      const sb = rcOf(slotB);
      const dr = sb.r - sa.r;
      const dc = sb.c - sa.c;
      if (Math.abs(dr) + Math.abs(dc) !== 1) return false;
      return (catalog[idB].row - catalog[idA].row) === dr &&
        (catalog[idB].col - catalog[idA].col) === dc;
    }

    function slotOffsetMatchesPieces(slotA, slotB, idA, idB) {
      return areCorrectlyAdjacentOnBoard(idA, slotA, idB, slotB);
    }

    function clearGhost() {
      if (ghost) {
        ghost.remove();
        ghost = null;
      }
    }

    function wipePuzzleState() {
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = "";
      sourceImg = null;
      catalog = [];
      boardSlots = [];
      trayIds = [];
      parent = [];
      groupPos = {};
      phase = "setup";
      won = false;
      helpOn = false;
      dragging = null;
      zTop = 2;
      clearGhost();
      helpImg.removeAttribute("src");
      helpImg.src = "";
      helpImg.classList.add("hidden");
      helpBtn.textContent = "Yardım Göster";
      helpBtn.classList.add("hidden");
      playHint.classList.add("hidden");
      shuffleBtn.classList.remove("hidden");
      tray.innerHTML = "";
      trayWrap.classList.add("hidden");
      board.innerHTML = "";
      win.classList.add("hidden");
      win.classList.remove("flex");
    }

    function resetAll() {
      loadGen += 1;
      wipePuzzleState();
      fileInput.value = "";
      photoHint.classList.add("hidden");
      game.classList.add("hidden");
      setup.classList.remove("hidden");
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function squareSource(img) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const size = Math.min(iw, ih);
      const sx = (iw - size) / 2;
      const sy = (ih - size) / 2;
      const out = Math.min(1400, Math.max(480, size));
      const c = document.createElement("canvas");
      c.width = out;
      c.height = out;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, size, size, 0, 0, out, out);
      return c;
    }

    function knobbyEdge(ctx, x0, y0, x1, y1, sign, ts) {
      if (!sign) {
        ctx.lineTo(x1, y1);
        return;
      }
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.hypot(dx, dy);
      const ux = dx / len;
      const uy = dy / len;
      const nx = uy;
      const ny = -ux;
      function pt(t, o) {
        return [x0 + ux * len * t + nx * ts * o * sign, y0 + uy * len * t + ny * ts * o * sign];
      }
      const a = pt(0.34, 0);
      ctx.lineTo(a[0], a[1]);
      const b = pt(0.38, 0.08);
      const c = pt(0.27, 0.82);
      const d = pt(0.5, 1);
      ctx.bezierCurveTo(b[0], b[1], c[0], c[1], d[0], d[1]);
      const e = pt(0.73, 0.82);
      const f = pt(0.62, 0.08);
      const g = pt(0.66, 0);
      ctx.bezierCurveTo(e[0], e[1], f[0], f[1], g[0], g[1]);
      ctx.lineTo(x1, y1);
    }

    function piecePath(ctx, w, h, L, T, R, B, ts) {
      ctx.moveTo(0, 0);
      knobbyEdge(ctx, 0, 0, w, 0, T, ts);
      knobbyEdge(ctx, w, 0, w, h, R, ts);
      knobbyEdge(ctx, w, h, 0, h, B, ts);
      knobbyEdge(ctx, 0, h, 0, 0, L, ts);
      ctx.closePath();
    }

    function paintBevel(ctx, cellW, cellH, L, T, R, B, tab) {
      ctx.save();
      ctx.beginPath();
      piecePath(ctx, cellW, cellH, L, T, R, B, tab);
      ctx.clip();
      const vert = ctx.createLinearGradient(0, 0, 0, cellH);
      vert.addColorStop(0, "rgba(255,255,255,0.48)");
      vert.addColorStop(0.16, "rgba(255,255,255,0.16)");
      vert.addColorStop(0.48, "rgba(0,0,0,0)");
      vert.addColorStop(0.84, "rgba(0,0,0,0.16)");
      vert.addColorStop(1, "rgba(0,0,0,0.34)");
      ctx.fillStyle = vert;
      ctx.fillRect(-tab, -tab, cellW + 2 * tab, cellH + 2 * tab);
      const horz = ctx.createLinearGradient(0, 0, cellW, 0);
      horz.addColorStop(0, "rgba(255,255,255,0.22)");
      horz.addColorStop(0.18, "rgba(255,255,255,0)");
      horz.addColorStop(0.82, "rgba(0,0,0,0)");
      horz.addColorStop(1, "rgba(0,0,0,0.2)");
      ctx.fillStyle = horz;
      ctx.fillRect(-tab, -tab, cellW + 2 * tab, cellH + 2 * tab);
      ctx.restore();
    }

    function slicePhoto(img, r, c) {
      const size = img.width;
      const cellW = size / c;
      const cellH = size / r;
      const tab = Math.min(cellW, cellH) * 0.22;
      tabFracX = tab / cellW;
      tabFracY = tab / cellH;
      const rnd = mulberry32((size * 1103515245 + r * 997 + c * 7919) >>> 0);
      const rightTab = [];
      const bottomTab = [];
      for (let y = 0; y < r; y++) {
        rightTab[y] = [];
        bottomTab[y] = [];
        for (let x = 0; x < c; x++) {
          rightTab[y][x] = x < c - 1 ? (rnd() < 0.5 ? 1 : -1) : 0;
          bottomTab[y][x] = y < r - 1 ? (rnd() < 0.5 ? 1 : -1) : 0;
        }
      }
      const out = [];
      for (let y = 0; y < r; y++) {
        for (let x = 0; x < c; x++) {
          const L = x === 0 ? 0 : -rightTab[y][x - 1];
          const R = rightTab[y][x];
          const T = y === 0 ? 0 : -bottomTab[y - 1][x];
          const B = bottomTab[y][x];
          const cw = cellW + 2 * tab;
          const ch = cellH + 2 * tab;
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(2, Math.round(cw));
          canvas.height = Math.max(2, Math.round(ch));
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.scale(canvas.width / cw, canvas.height / ch);
          ctx.translate(tab, tab);
          ctx.save();
          ctx.beginPath();
          piecePath(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.clip();
          ctx.drawImage(img, 0, 0, size, size, -x * cellW, -y * cellH, size, size);
          ctx.restore();
          paintBevel(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.beginPath();
          piecePath(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.strokeStyle = "rgba(16, 10, 24, 0.38)";
          ctx.lineWidth = Math.max(0.8, Math.min(cellW, cellH) * 0.01);
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();
          out.push({
            correct: y * c + x,
            row: y,
            col: x,
            src: canvas.toDataURL("image/png"),
            aw: canvas.width,
            ah: canvas.height
          });
        }
      }
      return out;
    }

    function smallPieceSize() {
      const slotW = (board.clientWidth || 280) / cols;
      const slotH = (board.clientHeight || 280) / rows;
      return Math.max(48, Math.min(76, Math.min(slotW, slotH) * 0.48));
    }

    function trayBoxFor(id, size) {
      const piece = catalog[id];
      const aspect = piece && piece.ah ? piece.aw / piece.ah : 1;
      if (aspect >= 1) return { w: size, h: size / aspect };
      return { w: size * aspect, h: size };
    }

    function trayCore(size) {
      const sample = trayIds[0] != null ? trayIds[0] : 0;
      const box = trayBoxFor(sample, size);
      return {
        w: box.w / (1 + 2 * tabFracX),
        h: box.h / (1 + 2 * tabFracY)
      };
    }

    function scatterPos(i, n) {
      const rnd = mulberry32((i + 1) * 9973 + n * 131 + i * 17 + Date.now());
      const size = smallPieceSize();
      const box = trayBoxFor(i, size);
      const tw = Math.max(160, tray.clientWidth || 300);
      const rowsFit = n > 12 ? 3 : n > 6 ? 2 : 1;
      const h = Math.max(160, Math.round(size * (rowsFit + 1.1)));
      tray.style.minHeight = h + "px";
      trayWrap.style.minHeight = h + "px";
      const maxL = Math.max(8, tw - box.w - 36);
      const maxT = Math.max(8, h - box.h - 36);
      return {
        l: 8 + rnd() * maxL,
        t: 18 + rnd() * maxT,
        z: i + 1
      };
    }

    function layoutGroupInTray(id) {
      const mem = trayMembers(id);
      if (!mem.length) return;
      const root = find(id);
      const size = smallPieceSize();
      const core = trayCore(size);
      if (!groupPos[root]) groupPos[root] = scatterPos(mem[0], catalog.length);
      const anchor = mem.reduce((a, b) => (catalog[a].correct < catalog[b].correct ? a : b));
      mem.forEach((pid) => {
        const dx = catalog[pid].col - catalog[anchor].col;
        const dy = catalog[pid].row - catalog[anchor].row;
        const box = trayBoxFor(pid, size);
        const extraX = (box.w - core.w) / 2;
        const extraY = (box.h - core.h) / 2;
        const aBox = trayBoxFor(anchor, size);
        const aExtraX = (aBox.w - core.w) / 2;
        const aExtraY = (aBox.h - core.h) / 2;
        catalog[pid]._box = {
          l: groupPos[root].l + dx * core.w + extraX - aExtraX,
          t: groupPos[root].t + dy * core.h + extraY - aExtraY,
          w: box.w,
          h: box.h,
          z: groupPos[root].z
        };
      });
    }

    function takeFromTray(id) {
      membersOf(id).forEach((pid) => {
        trayIds = trayIds.filter((x) => x !== pid);
      });
      delete groupPos[find(id)];
    }

    function addGroupToTray(id, pos) {
      const mem = membersOf(id);
      mem.forEach((pid) => {
        const from = boardSlots.indexOf(pid);
        if (from >= 0) boardSlots[from] = null;
        if (trayIds.indexOf(pid) < 0) trayIds.push(pid);
      });
      const root = find(id);
      groupPos[root] = pos || scatterPos(mem[0], catalog.length);
      groupPos[root].z = ++zTop;
      layoutGroupInTray(id);
    }

    function groupTargets(grabbedId, slotIndex) {
      const mem = membersOf(grabbedId);
      const g = catalog[grabbedId];
      const s = rcOf(slotIndex);
      const out = [];
      for (let i = 0; i < mem.length; i++) {
        const id = mem[i];
        const tr = s.r + (catalog[id].row - g.row);
        const tc = s.c + (catalog[id].col - g.col);
        if (tr < 0 || tc < 0 || tr >= rows || tc >= cols) return null;
        out.push({ id, ti: tr * cols + tc });
      }
      return out;
    }

    function mergeGroups() {
      let merged = false;
      let grew = true;
      while (grew) {
        grew = false;
        for (let slotA = 0; slotA < boardSlots.length; slotA++) {
          const idA = boardSlots[slotA];
          if (idA == null) continue;
          const sa = rcOf(slotA);
          [[0, 1], [1, 0]].forEach(([dr, dc]) => {
            const nr = sa.r + dr;
            const nc = sa.c + dc;
            if (nr >= rows || nc >= cols) return;
            const slotB = nr * cols + nc;
            const idB = boardSlots[slotB];
            if (idB == null) return;
            if (find(idA) === find(idB)) return;
            if (!areCorrectlyAdjacentOnBoard(idA, slotA, idB, slotB)) return;
            union(idA, idB);
            merged = true;
            grew = true;
          });
        }
      }
      return merged;
    }

    function placeGroupOnBoard(grabbedId, slotIndex) {
      slotIndex = resolveBoardDropSlot(grabbedId, slotIndex);
      const targets = groupTargets(grabbedId, slotIndex);
      if (!targets) return null;
      const mem = membersOf(grabbedId);
      const moving = {};
      mem.forEach((id) => { moving[id] = true; });
      const displaced = {};
      for (let i = 0; i < targets.length; i++) {
        const { id, ti } = targets[i];
        const occ = boardSlots[ti];
        if (occ == null || moving[occ]) continue;
        if (areNeighbors(id, occ)) return null;
        const root = find(occ);
        if (!displaced[root]) displaced[root] = occ;
      }
      Object.keys(displaced).forEach((k) => addGroupToTray(displaced[k]));
      takeFromTray(grabbedId);
      mem.forEach((pid) => {
        const from = boardSlots.indexOf(pid);
        if (from >= 0) boardSlots[from] = null;
      });
      targets.forEach(({ id, ti }) => {
        boardSlots[ti] = id;
      });
      mergeGroups();
      return targets;
    }

    function snapSound() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const ctx = snapSound.ctx || (snapSound.ctx = new AC());
        if (ctx.state === "suspended") ctx.resume();
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(520, t);
        osc.frequency.exponentialRampToValueAtTime(190, t + 0.09);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.11);
      } catch (err) { /* ignore */ }
    }

    function setGroupPosFromPiece(pid) {
      const root = find(pid);
      const mem = trayMembers(pid);
      if (!mem.length || !catalog[pid]._box) return;
      const anchor = mem.reduce((a, b) => (catalog[a].correct < catalog[b].correct ? a : b));
      const dx = catalog[pid].col - catalog[anchor].col;
      const dy = catalog[pid].row - catalog[anchor].row;
      const size = smallPieceSize();
      const core = trayCore(size);
      const box = catalog[pid]._box;
      const pBox = trayBoxFor(pid, size);
      const aBox = trayBoxFor(anchor, size);
      const extraX = (pBox.w - core.w) / 2;
      const extraY = (pBox.h - core.h) / 2;
      const aExtraX = (aBox.w - core.w) / 2;
      const aExtraY = (aBox.h - core.h) / 2;
      groupPos[root] = {
        l: box.l - dx * core.w - extraX + aExtraX,
        t: box.t - dy * core.h - extraY + aExtraY,
        z: (groupPos[root] && groupPos[root].z) || ++zTop
      };
    }

    function trySnapTray(movedId) {
      const size = smallPieceSize();
      const core = trayCore(size);
      const threshX = core.w * 0.72;
      const threshY = core.h * 0.72;
      let grew = true;
      let snapped = false;
      while (grew) {
        grew = false;
        const mem = trayMembers(movedId);
        for (let i = 0; i < mem.length; i++) {
          const id = mem[i];
          layoutGroupInTray(id);
          const box = catalog[id]._box;
          const nbrs = neighborIdsOf(id);
          for (let k = 0; k < nbrs.length; k++) {
            const n = nbrs[k];
            if (trayIds.indexOf(n) < 0) continue;
            if (find(n) === find(id)) continue;
            layoutGroupInTray(n);
            const nb = catalog[n]._box;
            const wantDx = (catalog[id].col - catalog[n].col) * core.w;
            const wantDy = (catalog[id].row - catalog[n].row) * core.h;
            const idCx = box.l + box.w / 2;
            const idCy = box.t + box.h / 2;
            const nCx = nb.l + nb.w / 2;
            const nCy = nb.t + nb.h / 2;
            const errX = (idCx - nCx) - wantDx;
            const errY = (idCy - nCy) - wantDy;
            if (Math.abs(errX) > threshX || Math.abs(errY) > threshY) continue;
            const rootM = find(id);
            if (!groupPos[rootM]) groupPos[rootM] = { l: 8, t: 8, z: ++zTop };
            groupPos[rootM].l += (nCx + wantDx) - idCx;
            groupPos[rootM].t += (nCy + wantDy) - idCy;
            layoutGroupInTray(id);
            union(n, id);
            setGroupPosFromPiece(n);
            groupPos[find(n)].z = ++zTop;
            layoutGroupInTray(find(n));
            grew = true;
            snapped = true;
            break;
          }
          if (grew) break;
        }
      }
      return snapped;
    }

    function groupFitsEmpty(grabbedId, grabbedSlot, moving) {
      const targets = groupTargets(grabbedId, grabbedSlot);
      if (!targets) return false;
      for (let i = 0; i < targets.length; i++) {
        const occ = boardSlots[targets[i].ti];
        if (occ != null && !moving[occ]) return false;
      }
      return true;
    }

    function attachSlotBeside(memberId, neighborId, neighborSlot, grabbedId) {
      const ns = rcOf(neighborSlot);
      const wantR = ns.r + (catalog[memberId].row - catalog[neighborId].row);
      const wantC = ns.c + (catalog[memberId].col - catalog[neighborId].col);
      if (wantR < 0 || wantC < 0 || wantR >= rows || wantC >= cols) return -1;
      const gR = wantR + (catalog[grabbedId].row - catalog[memberId].row);
      const gC = wantC + (catalog[grabbedId].col - catalog[memberId].col);
      if (gR < 0 || gC < 0 || gR >= rows || gC >= cols) return -1;
      return gR * cols + gC;
    }

    // If the pointer is on a neighbor (or 1 slot off the join cell), land on the
    // empty slot that keeps true left/right or up/down geometry — do NOT occupy
    // the neighbor and kick it back to the tray.
    function resolveBoardDropSlot(grabbedId, slotIndex) {
      if (slotIndex < 0) return slotIndex;
      const mem = membersOf(grabbedId);
      const moving = movingSet(grabbedId);
      const drop = rcOf(slotIndex);
      const home = catalog[grabbedId].correct;
      const homeRc = rcOf(home);
      const homeD = Math.abs(homeRc.r - drop.r) + Math.abs(homeRc.c - drop.c);
      if (homeD === 0 && groupFitsEmpty(grabbedId, home, moving)) return home;

      let best = -1;
      let bestD = Infinity;
      for (let ti = 0; ti < boardSlots.length; ti++) {
        const oid = boardSlots[ti];
        if (oid == null || moving[oid]) continue;
        for (let i = 0; i < mem.length; i++) {
          const id = mem[i];
          if (!areNeighbors(id, oid)) continue;
          const gSlot = attachSlotBeside(id, oid, ti, grabbedId);
          if (gSlot < 0) continue;
          if (!groupFitsEmpty(grabbedId, gSlot, moving)) continue;
          const gs = rcOf(gSlot);
          const d = Math.abs(gs.r - drop.r) + Math.abs(gs.c - drop.c);
          const nd = Math.abs(rcOf(ti).r - drop.r) + Math.abs(rcOf(ti).c - drop.c);
          const score = Math.min(d, nd);
          if (score < bestD) {
            bestD = score;
            best = gSlot;
          }
        }
      }
      if (best >= 0 && bestD <= 1) return best;
      return slotIndex;
    }

    function slotIndexAt(x, y) {
      const wrap = document.getElementById("boardWrap");
      const wr = wrap.getBoundingClientRect();
      const overBoard = x >= wr.left && x <= wr.right && y >= wr.top && y <= wr.bottom;
      const el = document.elementFromPoint(x, y);
      const hit = el && el.closest ? el.closest(".slot") : null;
      if (hit && board.contains(hit)) return Number(hit.dataset.i);
      if (!overBoard) return -1;
      let best = -1;
      let bestD = Infinity;
      board.querySelectorAll(".slot").forEach((s) => {
        const r = s.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          best = Number(s.dataset.i);
          bestD = 0;
          return;
        }
        const cx = (r.left + r.right) / 2;
        const cy = (r.top + r.bottom) / 2;
        const d = Math.hypot(x - cx, y - cy);
        if (d < bestD) {
          bestD = d;
          best = Number(s.dataset.i);
        }
      });
      return best;
    }

    function cellSize() {
      const s = board.querySelector(".slot");
      const r = s && s.getBoundingClientRect();
      const br = board.getBoundingClientRect();
      return {
        w: r ? r.width : (br.width / Math.max(1, cols)),
        h: r ? r.height : (br.height / Math.max(1, rows))
      };
    }

    // Snap if pointer is in a slot, or piece-core is within 40% of a slot origin.
    function snapSlotAt(x, y, coreLeft, coreTop, cellW, cellH) {
      const threshX = cellW * 0.4;
      const threshY = cellH * 0.4;
      let best = -1;
      let bestD = Infinity;
      board.querySelectorAll(".slot").forEach((s) => {
        const r = s.getBoundingClientRect();
        const i = Number(s.dataset.i);
        const dx = coreLeft - r.left;
        const dy = coreTop - r.top;
        const inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        const close = Math.abs(dx) <= threshX && Math.abs(dy) <= threshY;
        if (!inside && !close) return;
        const d = Math.hypot(dx, dy);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      });
      return best;
    }

    // If not on a slot, lock to a true neighbor already on the board (dx=cellW, dy=cellH).
    function neighborSnapSlot(grabbedId, coreLeft, coreTop, cellW, cellH) {
      const mem = membersOf(grabbedId);
      const moving = movingSet(grabbedId);
      const threshX = cellW * 0.4;
      const threshY = cellH * 0.4;
      let best = -1;
      let bestD = Infinity;
      for (let i = 0; i < mem.length; i++) {
        const id = mem[i];
        const myLeft = coreLeft + (catalog[id].col - catalog[grabbedId].col) * cellW;
        const myTop = coreTop + (catalog[id].row - catalog[grabbedId].row) * cellH;
        const nbrs = neighborIdsOf(id);
        for (let k = 0; k < nbrs.length; k++) {
          const n = nbrs[k];
          const nSlot = boardSlots.indexOf(n);
          if (nSlot < 0) continue;
          const slotEl = board.querySelector('.slot[data-i="' + nSlot + '"]');
          if (!slotEl) continue;
          const nr = slotEl.getBoundingClientRect();
          const wantLeft = nr.left + (catalog[id].col - catalog[n].col) * cellW;
          const wantTop = nr.top + (catalog[id].row - catalog[n].row) * cellH;
          const dx = myLeft - wantLeft;
          const dy = myTop - wantTop;
          if (Math.abs(dx) > threshX || Math.abs(dy) > threshY) continue;
          const gSlot = attachSlotBeside(id, n, nSlot, grabbedId);
          if (gSlot < 0) continue;
          if (!groupFitsEmpty(grabbedId, gSlot, moving)) continue;
          const d = Math.hypot(dx, dy);
          if (d < bestD) {
            bestD = d;
            best = gSlot;
          }
        }
      }
      return best;
    }

    function clearDropTargets() {
      board.querySelectorAll(".slot.drop-target").forEach((el) => el.classList.remove("drop-target"));
    }

    function highlightTargets(grabbedId, slotIndex) {
      clearDropTargets();
      const targets = groupTargets(grabbedId, slotIndex);
      if (!targets) {
        const slot = board.querySelector('.slot[data-i="' + slotIndex + '"]');
        if (slot) slot.classList.add("drop-target");
        return;
      }
      targets.forEach(({ ti }) => {
        const slot = board.querySelector('.slot[data-i="' + ti + '"]');
        if (slot) slot.classList.add("drop-target");
      });
    }

    function renderBoard() {
      board.style.display = "block";
      board.style.position = "relative";
      board.style.gap = "0px";
      board.style.padding = "0px";
      board.style.margin = "0px";
      board.style.overflow = "visible";
      const wrap = document.getElementById("boardWrap");
      const tabPad = tabFracX / Math.max(1, cols);
      wrap.style.padding = ((tabPad / (1 + 2 * tabPad)) * 100).toFixed(3) + "%";
      board.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "board-grid";
      grid.style.display = "grid";
      grid.style.gap = "0px";
      grid.style.padding = "0px";
      grid.style.margin = "0px";
      grid.style.width = "100%";
      grid.style.height = "100%";
      grid.style.overflow = "visible";
      grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
      grid.style.gridTemplateRows = "repeat(" + rows + ", minmax(0, 1fr))";
      grid.style.setProperty("--tabx", String(tabFracX));
      grid.style.setProperty("--taby", String(tabFracY));
      boardSlots.forEach((pieceId, i) => {
        const cell = document.createElement("div");
        cell.className = "slot" + (pieceId == null ? "" : " filled");
        cell.dataset.i = String(i);
        cell.style.padding = "0";
        cell.style.margin = "0";
        cell.style.border = "none";
        cell.style.overflow = "visible";
        if (pieceId != null && phase === "playing") {
          if (membersOf(pieceId).length > 1) cell.classList.add("grouped");
          cell.addEventListener("pointerdown", (e) => onPointerDown(e, pieceId));
        }
        grid.appendChild(cell);
      });
      const layer = document.createElement("div");
      layer.className = "piece-layer";
      layer.style.position = "absolute";
      layer.style.left = "0";
      layer.style.top = "0";
      layer.style.width = "100%";
      layer.style.height = "100%";
      layer.style.overflow = "visible";
      layer.style.pointerEvents = "none";
      boardSlots.forEach((pieceId, i) => {
        if (pieceId == null) return;
        const r = Math.floor(i / cols);
        const c = i % cols;
        const img = document.createElement("img");
        img.className = "piece";
        img.src = catalog[pieceId].src;
        img.alt = "";
        img.draggable = false;
        img.dataset.i = String(i);
        img.style.position = "absolute";
        img.style.pointerEvents = "none";
        img.style.maxWidth = "none";
        img.style.maxHeight = "none";
        img.style.margin = "0";
        img.style.padding = "0";
        img.style.left = ((c - tabFracX) / cols * 100) + "%";
        img.style.top = ((r - tabFracY) / rows * 100) + "%";
        img.style.width = ((1 + 2 * tabFracX) / cols * 100) + "%";
        img.style.height = ((1 + 2 * tabFracY) / rows * 100) + "%";
        img.style.zIndex = String(10 + i);
        if (phase === "playing" && membersOf(pieceId).length > 1) {
          img.style.filter = "drop-shadow(0 0 0.6px rgba(34, 197, 94, 0.4))";
        }
        layer.appendChild(img);
      });
      board.appendChild(grid);
      board.appendChild(layer);
    }

    function renderTray() {
      tray.innerHTML = "";
      if (phase !== "playing") return;
      const seen = {};
      trayIds.forEach((id) => {
        const root = find(id);
        if (seen[root]) return;
        seen[root] = true;
        layoutGroupInTray(id);
        const mem = trayMembers(id);
        mem.forEach((pid) => {
          const b = catalog[pid]._box;
          const img = document.createElement("img");
          img.className = "tray-piece";
          img.src = catalog[pid].src;
          img.alt = "";
          img.draggable = false;
          img.dataset.id = String(pid);
          img.style.maxWidth = "none";
          img.style.maxHeight = "none";
          img.style.left = b.l + "px";
          img.style.top = b.t + "px";
          img.style.width = b.w + "px";
          img.style.height = b.h + "px";
          img.style.zIndex = String(b.z);
          if (mem.length > 1) img.style.filter = "drop-shadow(0 0 0.6px rgba(34, 197, 94, 0.4)) drop-shadow(2px 8px 10px rgba(0, 0, 0, .38))";
          if (dragging && membersOf(dragging.id).indexOf(pid) >= 0) img.style.opacity = "0.2";
          img.addEventListener("pointerdown", (e) => onPointerDown(e, pid));
          tray.appendChild(img);
        });
      });
    }

    function render() {
      renderBoard();
      renderTray();
    }

    function pieceDisplay(id, cellW, cellH) {
      return {
        w: cellW * (1 + 2 * tabFracX),
        h: cellH * (1 + 2 * tabFracY),
        ox: cellW * tabFracX,
        oy: cellH * tabFracY
      };
    }

    function buildGhost(id, cellW, cellH) {
      clearGhost();
      ghost = document.createElement("div");
      ghost.className = "ghost";
      const mem = membersOf(id);
      const d = pieceDisplay(id, cellW, cellH);
      mem.forEach((pid) => {
        const dx = catalog[pid].col - catalog[id].col;
        const dy = catalog[pid].row - catalog[id].row;
        const img = document.createElement("img");
        img.src = catalog[pid].src;
        img.alt = "";
        img.style.maxWidth = "none";
        img.style.maxHeight = "none";
        img.style.width = d.w + "px";
        img.style.height = d.h + "px";
        img.style.left = (dx * cellW - d.ox) + "px";
        img.style.top = (dy * cellH - d.oy) + "px";
        img.style.margin = "0";
        ghost.appendChild(img);
      });
      document.body.appendChild(ghost);
    }

    function placeGhost(x, y, ox, oy) {
      if (!ghost) return;
      ghost.style.left = (x - ox) + "px";
      ghost.style.top = (y - oy) + "px";
    }

    function onPointerDown(e, id) {
      if (phase !== "playing" || won) return;
      if (e.button != null && e.button !== 0) return;
      if (dragging) return;
      const onBoard = boardSlots.indexOf(id) >= 0;
      const inTray = trayIds.indexOf(id) >= 0;
      if (!onBoard && !inTray) return;
      e.preventDefault();
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      const mem = membersOf(id);
      const size = smallPieceSize();
      const core = trayCore(size);
      const root = find(id);
      const prevSlots = mem.map((pid) => ({ id: pid, ti: boardSlots.indexOf(pid) }));
      let ox;
      let oy;
      let cellW = core.w;
      let cellH = core.h;
      if (onBoard) {
        const slotEl = board.querySelector('.slot[data-i="' + boardSlots.indexOf(id) + '"]');
        const sr = slotEl ? slotEl.getBoundingClientRect() : null;
        cellW = sr ? sr.width : core.w;
        cellH = sr ? sr.height : core.h;
        ox = sr ? e.clientX - sr.left : cellW / 2;
        oy = sr ? e.clientY - sr.top : cellH / 2;
        mem.forEach((pid) => {
          const from = boardSlots.indexOf(pid);
          if (from >= 0) boardSlots[from] = null;
        });
      } else {
        layoutGroupInTray(id);
        const box = catalog[id]._box;
        if (groupPos[root]) groupPos[root].z = ++zTop;
        const origin = tray.getBoundingClientRect();
        ox = e.clientX - (origin.left + box.l);
        oy = e.clientY - (origin.top + box.t);
      }
      dragging = {
        id: id,
        pointerId: e.pointerId,
        ox: ox,
        oy: oy,
        oxFromCore: onBoard,
        startW: cellW,
        startH: cellH,
        coreW: core.w,
        coreH: core.h,
        cellW: cellW,
        cellH: cellH,
        moved: false,
        fromBoard: onBoard,
        prevSlots: prevSlots,
        hoverSlot: onBoard ? prevSlots.filter((p) => p.id === id)[0].ti : -1,
        sx: e.clientX,
        sy: e.clientY
      };
      buildGhost(id, cellW, cellH);
      if (onBoard) {
        const slotEl = board.querySelector('.slot[data-i="' + dragging.hoverSlot + '"]');
        const sr = slotEl && slotEl.getBoundingClientRect();
        if (sr) {
          ghost.style.left = sr.left + "px";
          ghost.style.top = sr.top + "px";
        } else {
          placeGhost(e.clientX, e.clientY, ox - cellW * tabFracX, oy - cellH * tabFracY);
        }
        render();
      } else {
        placeGhost(e.clientX, e.clientY, ox - cellW * tabFracX, oy - cellH * tabFracY);
        renderTray();
      }
      window.addEventListener("pointermove", onWinPointerMove);
      window.addEventListener("pointerup", onWinPointerUp);
      window.addEventListener("pointercancel", onWinPointerUp);
    }

    function onWinPointerMove(e) {
      if (!dragging || e.pointerId !== dragging.pointerId) return;
      e.preventDefault();
      if (Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) > 10) dragging.moved = true;
      const cs = cellSize();
      const cellW = cs.w || dragging.cellW;
      const cellH = cs.h || dragging.cellH;
      let coreLeft = e.clientX - dragging.ox + (dragging.oxFromCore ? 0 : cellW * tabFracX);
      let coreTop = e.clientY - dragging.oy + (dragging.oxFromCore ? 0 : cellH * tabFracY);
      if (ghost && dragging.hoverSlot >= 0) {
        const gr = ghost.getBoundingClientRect();
        coreLeft = gr.left;
        coreTop = gr.top;
      }
      let slotIndex = snapSlotAt(e.clientX, e.clientY, coreLeft, coreTop, cellW, cellH);
      if (slotIndex < 0) slotIndex = neighborSnapSlot(dragging.id, coreLeft, coreTop, cellW, cellH);
      if (slotIndex < 0) slotIndex = slotIndexAt(e.clientX, e.clientY);
      if (slotIndex >= 0) slotIndex = resolveBoardDropSlot(dragging.id, slotIndex);
      clearDropTargets();
      if (slotIndex >= 0) {
        dragging.hoverSlot = slotIndex;
        highlightTargets(dragging.id, slotIndex);
        const slot = board.querySelector('.slot[data-i="' + slotIndex + '"]');
        const sr = slot && slot.getBoundingClientRect();
        if (sr) {
          if (dragging.cellW !== sr.width || dragging.cellH !== sr.height || !ghost) {
            dragging.cellW = sr.width;
            dragging.cellH = sr.height;
            buildGhost(dragging.id, sr.width, sr.height);
          }
          ghost.style.left = sr.left + "px";
          ghost.style.top = sr.top + "px";
        }
      } else {
        dragging.hoverSlot = -1;
        if (dragging.cellW !== dragging.coreW || dragging.cellH !== dragging.coreH || !ghost) {
          dragging.cellW = dragging.coreW;
          dragging.cellH = dragging.coreH;
          buildGhost(dragging.id, dragging.coreW, dragging.coreH);
        }
        placeGhost(e.clientX, e.clientY, dragging.ox - dragging.coreW * tabFracX, dragging.oy - dragging.coreH * tabFracY);
      }
    }

    function restorePrevSlots(prevSlots) {
      if (!prevSlots) return;
      prevSlots.forEach(({ id, ti }) => {
        if (ti >= 0 && boardSlots[ti] == null) boardSlots[ti] = id;
      });
    }

    function endDrag(e) {
      if (!dragging || e.pointerId !== dragging.pointerId) return;
      window.removeEventListener("pointermove", onWinPointerMove);
      window.removeEventListener("pointerup", onWinPointerUp);
      window.removeEventListener("pointercancel", onWinPointerUp);
      const x = e.clientX;
      const y = e.clientY;
      const id = dragging.id;
      const ox = dragging.ox;
      const oy = dragging.oy;
      const fromBoard = dragging.fromBoard;
      const prevSlots = dragging.prevSlots;
      const cs = cellSize();
      const cellW = cs.w || dragging.cellW;
      const cellH = cs.h || dragging.cellH;
      let coreLeft;
      let coreTop;
      if (ghost) {
        const gr = ghost.getBoundingClientRect();
        coreLeft = gr.left;
        coreTop = gr.top;
      } else {
        const tabOx = dragging.oxFromCore ? 0 : cellW * tabFracX;
        const tabOy = dragging.oxFromCore ? 0 : cellH * tabFracY;
        coreLeft = x - ox + tabOx;
        coreTop = y - oy + tabOy;
      }
      let slotIndex = snapSlotAt(x, y, coreLeft, coreTop, cellW, cellH);
      if (slotIndex < 0) {
        slotIndex = neighborSnapSlot(id, coreLeft, coreTop, cellW, cellH);
      }
      if (slotIndex < 0 && dragging.hoverSlot >= 0) {
        const wr = document.getElementById("boardWrap").getBoundingClientRect();
        if (x >= wr.left && x <= wr.right && y >= wr.top && y <= wr.bottom) {
          const slot = board.querySelector('.slot[data-i="' + dragging.hoverSlot + '"]');
          const sr = slot && slot.getBoundingClientRect();
          if (sr && Math.abs(coreLeft - sr.left) <= cellW * 0.4 && Math.abs(coreTop - sr.top) <= cellH * 0.4) {
            slotIndex = dragging.hoverSlot;
          }
        }
      }
      if (slotIndex >= 0) slotIndex = resolveBoardDropSlot(id, slotIndex);
      clearDropTargets();
      clearGhost();
      dragging = null;
      const sizeBefore = membersOf(id).length;
      let placed = null;
      let didMerge = false;
      if (slotIndex >= 0) {
        placed = placeGroupOnBoard(id, slotIndex);
      }
      if (placed) {
        didMerge = membersOf(id).length > sizeBefore;
      }
      if (!placed) {
        const tr = trayWrap.getBoundingClientRect();
        const overTray = x >= tr.left - 24 && x <= tr.right + 24 && y >= tr.top - 24 && y <= tr.bottom + 24;
        if (fromBoard && !overTray) {
          restorePrevSlots(prevSlots);
          didMerge = mergeGroups() || membersOf(id).length > sizeBefore;
        } else {
          const root = find(id);
          if (trayIds.indexOf(id) < 0) addGroupToTray(id);
          if (!groupPos[root]) groupPos[root] = { l: 8, t: 8, z: ++zTop };
          if (overTray) {
            const origin = tray.getBoundingClientRect();
            groupPos[root].l = Math.max(4, Math.min(tr.width - 48, x - origin.left - ox));
            groupPos[root].t = Math.max(4, Math.min(tr.height - 48, y - origin.top - oy));
          }
          groupPos[root].z = ++zTop;
          layoutGroupInTray(id);
          setGroupPosFromPiece(id);
          didMerge = trySnapTray(id) || didMerge;
        }
      }
      const snapSlots = [];
      if (placed) {
        placed.forEach(({ id: pid, ti }) => {
          if (catalog[pid].correct === ti) snapSlots.push(ti);
        });
      }
      if (didMerge) {
        membersOf(id).forEach((pid) => {
          const ti = slotOf(pid);
          if (ti >= 0 && snapSlots.indexOf(ti) < 0) snapSlots.push(ti);
        });
      }
      render();
      if (snapSlots.length || didMerge) {
        snapSound();
        snapSlots.forEach((ti) => {
          const slot = board.querySelector('.slot[data-i="' + ti + '"]');
          if (slot) slot.classList.add("snap-lock");
          const piece = board.querySelector('img.piece[data-i="' + ti + '"]');
          if (piece) piece.classList.add("snap-lock");
        });
      }
      checkWin();
    }

    function onWinPointerUp(e) {
      if (!dragging) return;
      endDrag(e);
    }

    function checkWin() {
      if (won || phase !== "playing" || !catalog.length) return;
      if (trayIds.length) return;
      if (!boardSlots.every((id, i) => id != null && catalog[id].correct === i)) return;
      won = true;
      win.classList.remove("hidden");
      win.classList.add("flex");
      clap();
    }

    function clap() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const dur = 0.18;
          const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let n = 0; n < data.length; n++) data[n] = (Math.random() * 2 - 1) * (1 - n / data.length);
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = 1800 + Math.random() * 1200;
          const gain = ctx.createGain();
          gain.gain.value = 0.22;
          src.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          src.start();
        }, i * 70);
      }
    }

    function startAssembled(n) {
      if (!sourceImg) {
        showToast("Önce fotoğraf seç");
        return;
      }
      const g = gridFor(n);
      rows = g[0];
      cols = g[1];
      catalog = slicePhoto(sourceImg, rows, cols);
      resetGroups();
      boardSlots = catalog.map((_, i) => i);
      trayIds = [];
      phase = "assembled";
      won = false;
      helpOn = false;
      helpImg.classList.add("hidden");
      helpBtn.textContent = "Yardım Göster";
      helpBtn.classList.add("hidden");
      playHint.classList.add("hidden");
      helpImg.src = sourceImg.toDataURL("image/jpeg", 0.88);
      shuffleBtn.classList.remove("hidden");
      trayWrap.classList.add("hidden");
      setup.classList.add("hidden");
      game.classList.remove("hidden");
      render();
    }

    function scatterPieces() {
      if (phase !== "assembled" || !catalog.length) return;
      boardSlots = catalog.map(() => null);
      parent = catalog.map((_, i) => i);
      trayIds = catalog.map((_, id) => id);
      groupPos = {};
      catalog.forEach((_, id) => {
        groupPos[id] = scatterPos(id, catalog.length);
      });
      phase = "playing";
      won = false;
      shuffleBtn.classList.add("hidden");
      trayWrap.classList.remove("hidden");
      helpBtn.classList.remove("hidden");
      playHint.classList.remove("hidden");
      render();
    }

    document.addEventListener("touchmove", (e) => {
      if (dragging) e.preventDefault();
    }, { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());

    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const gen = ++loadGen;
      wipePuzzleState();
      photoHint.classList.add("hidden");
      game.classList.add("hidden");
      setup.classList.remove("hidden");
      photoUrl = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        if (gen !== loadGen) return;
        const cropped = squareSource(img);
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = "";
        if (gen !== loadGen) return;
        sourceImg = cropped;
        helpImg.removeAttribute("src");
        helpImg.src = cropped.toDataURL("image/jpeg", 0.88);
        photoHint.classList.remove("hidden");
      };
      img.onerror = () => {
        if (gen !== loadGen) return;
        showToast("Fotoğraf okunamadı");
        wipePuzzleState();
      };
      img.src = photoUrl;
    });
    document.querySelectorAll(".piece-btn").forEach((btn) => {
      btn.addEventListener("click", () => startAssembled(Number(btn.dataset.n)));
    });
    shuffleBtn.addEventListener("click", scatterPieces);
    helpBtn.addEventListener("click", () => {
      helpOn = !helpOn;
      helpImg.classList.toggle("hidden", !helpOn);
      helpBtn.textContent = helpOn ? "Yardımı Gizle" : "Yardım Göster";
    });
    resetBtn.addEventListener("click", resetAll);
    document.getElementById("winOk").addEventListener("click", () => {
      win.classList.add("hidden");
      win.classList.remove("flex");
    });
  </script>
</body>
</html>
