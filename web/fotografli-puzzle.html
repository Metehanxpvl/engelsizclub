<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Fotoğraflı Puzzle - Engelsiz Club</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: "#22c55e" } } } };
  </script>
  <style>
    html, body { background: #fff; }
    #boardWrap {
      background: #d9d0ea;
      padding: 8%;
    }
    #board {
      overflow: visible;
      aspect-ratio: 1;
    }
    .slot {
      position: relative;
      overflow: visible;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: rgba(255, 255, 255, 0.28);
    }
    .slot.filled { background: transparent; }
    .slot.drop-target {
      background: rgba(34, 197, 94, 0.22);
      box-shadow: inset 0 0 0 2px #22c55e;
    }
    .slot img.piece {
      position: absolute;
      pointer-events: none;
      width: calc(100% * (1 + 2 * var(--tabx)));
      height: calc(100% * (1 + 2 * var(--taby)));
      left: calc(-100% * var(--tabx));
      top: calc(-100% * var(--taby));
    }
    #trayWrap {
      background: #f3eef9;
      border: 2px dashed #c4b5e0;
      min-height: 140px;
      overflow: visible;
    }
    #tray {
      position: relative;
      width: 100%;
      min-height: 140px;
      touch-action: none;
    }
    .tray-piece {
      position: absolute;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      height: auto;
      filter: drop-shadow(2px 8px 10px rgba(0, 0, 0, .38));
    }
    .ghost {
      position: fixed;
      pointer-events: none;
      z-index: 80;
    }
    .ghost img {
      position: absolute;
      filter: drop-shadow(3px 12px 16px rgba(0, 0, 0, .42));
    }
    .photo-pick {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      border-radius: 1rem;
      background: #22c55e;
      color: #fff;
      font-size: 1.125rem;
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
      cursor: pointer;
      overflow: hidden;
    }
    .photo-pick span {
      pointer-events: none;
      position: relative;
      z-index: 1;
    }
    /* Android WebView: keep input in layout (not display:none). Large font-size
       so the native file button fills the label; opacity > 0 so clicks register. */
    .photo-pick input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.01;
      font-size: 48px;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-slate-800">
  <div class="max-w-md mx-auto px-3 pt-4 pb-10">
    <h1 class="text-center text-[1.35rem] sm:text-2xl font-extrabold text-brand leading-tight">Fotoğraflı Puzzle - Engelsiz Club</h1>
    <p class="text-center text-sm text-slate-500 mt-1 mb-4">Fotoğrafını seç, karıştır, parçaları doğru yerlere kilitle.</p>

    <div id="setup" class="space-y-3">
      <label for="file" class="photo-pick">
        <span>Fotoğraf Seç / Çek</span>
        <input id="file" type="file" accept="image/*" />
      </label>
      <p id="photoHint" class="text-center text-sm text-slate-500 hidden">Fotoğraf hazır. Parça sayısını seç.</p>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" data-n="4" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">4 Parça</button>
        <button type="button" data-n="9" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">9 Parça</button>
        <button type="button" data-n="12" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">12 Parça</button>
        <button type="button" data-n="16" class="piece-btn min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">16 Parça</button>
        <button type="button" data-n="20" class="piece-btn col-span-2 min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold text-base">20 Parça</button>
      </div>
    </div>

    <div id="game" class="hidden">
      <div class="flex gap-2 mb-3">
        <button id="helpBtn" type="button" class="flex-1 min-h-[48px] rounded-2xl bg-brand text-white font-extrabold hidden">Yardım Göster</button>
        <button id="resetBtn" type="button" class="flex-1 min-h-[48px] rounded-2xl border-2 border-brand text-brand font-extrabold">Yeni Fotoğraf</button>
      </div>
      <button id="shuffleBtn" type="button" class="w-full min-h-[52px] rounded-2xl bg-brand text-white text-lg font-extrabold shadow-sm mb-3">Fotoğrafı karıştır</button>
      <p id="playHint" class="hidden text-center text-xs text-slate-500 mb-2">Parçaları sürükle; doğru yerde ve komşularına kilitlenir</p>
      <div id="trayWrap" class="relative mx-auto w-full max-w-[360px] rounded-2xl mb-3 hidden">
        <div id="tray"></div>
      </div>
      <div id="boardWrap" class="relative mx-auto w-full max-w-[360px] rounded-2xl overflow-hidden border-2 border-brand">
        <div id="board" class="relative grid w-full"></div>
        <img id="helpImg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40 hidden pointer-events-none z-10" />
      </div>
    </div>
  </div>

  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 hidden z-40 px-4 py-3 rounded-2xl bg-slate-800 text-white font-bold text-sm shadow-lg"></div>

  <div id="win" class="fixed inset-0 hidden z-50 bg-black/50 items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-xl">
      <p class="text-3xl font-black text-brand">Harikasın! 🎉</p>
      <p class="mt-2 text-slate-600 font-semibold">Tüm parçalar yerine oturdu.</p>
      <button id="winOk" type="button" class="mt-5 w-full min-h-[48px] rounded-2xl bg-brand text-white font-extrabold">Tamam</button>
    </div>
  </div>

  <script>
    const LAYOUT = { 4: [2, 2], 9: [3, 3], 12: [3, 4], 16: [4, 4], 20: [4, 5] };
    const fileInput = document.getElementById("file");
    const photoHint = document.getElementById("photoHint");
    const playHint = document.getElementById("playHint");
    const setup = document.getElementById("setup");
    const game = document.getElementById("game");
    const board = document.getElementById("board");
    const tray = document.getElementById("tray");
    const trayWrap = document.getElementById("trayWrap");
    const helpImg = document.getElementById("helpImg");
    const helpBtn = document.getElementById("helpBtn");
    const resetBtn = document.getElementById("resetBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const toast = document.getElementById("toast");
    const win = document.getElementById("win");

    let photoUrl = "";
    let sourceImg = null;
    let catalog = [];
    let boardSlots = [];
    let trayIds = [];
    let parent = [];
    let groupPos = {};
    let rows = 2;
    let cols = 2;
    let tabFracX = 0.2;
    let tabFracY = 0.2;
    let phase = "setup";
    let helpOn = false;
    let ghost = null;
    let won = false;
    let loadGen = 0;
    let dragging = null;
    let zTop = 2;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    function gridFor(n) {
      if (LAYOUT[n]) return LAYOUT[n];
      let bestR = 2;
      let bestC = Math.max(2, Math.ceil(n / 2));
      let bestScore = Infinity;
      for (let r = 2; r <= Math.floor(n / 2); r++) {
        if (n % r !== 0) continue;
        const c = n / r;
        if (c < 2) continue;
        const score = Math.abs(r - c);
        if (score < bestScore) {
          bestScore = score;
          bestR = Math.min(r, c);
          bestC = Math.max(r, c);
        }
      }
      return [Math.max(2, bestR), Math.max(2, bestC)];
    }

    function rcOf(slot) {
      return { r: Math.floor(slot / cols), c: slot % cols };
    }

    function find(i) {
      while (parent[i] !== i) {
        parent[i] = parent[parent[i]];
        i = parent[i];
      }
      return i;
    }

    function union(a, b) {
      const ra = find(a);
      const rb = find(b);
      if (ra === rb) return ra;
      parent[rb] = ra;
      if (groupPos[rb] && !groupPos[ra]) groupPos[ra] = groupPos[rb];
      delete groupPos[rb];
      return ra;
    }

    function membersOf(id) {
      const root = find(id);
      const out = [];
      for (let i = 0; i < catalog.length; i++) if (find(i) === root) out.push(i);
      return out;
    }

    function trayMembers(id) {
      return membersOf(id).filter((i) => trayIds.indexOf(i) >= 0);
    }

    function resetGroups() {
      parent = catalog.map((_, i) => i);
      groupPos = {};
    }

    function areNeighbors(a, b) {
      const pa = catalog[a];
      const pb = catalog[b];
      return Math.abs(pa.row - pb.row) + Math.abs(pa.col - pb.col) === 1;
    }

    function clearGhost() {
      if (ghost) {
        ghost.remove();
        ghost = null;
      }
    }

    function wipePuzzleState() {
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = "";
      sourceImg = null;
      catalog = [];
      boardSlots = [];
      trayIds = [];
      parent = [];
      groupPos = {};
      phase = "setup";
      won = false;
      helpOn = false;
      dragging = null;
      zTop = 2;
      clearGhost();
      helpImg.removeAttribute("src");
      helpImg.src = "";
      helpImg.classList.add("hidden");
      helpBtn.textContent = "Yardım Göster";
      helpBtn.classList.add("hidden");
      playHint.classList.add("hidden");
      shuffleBtn.classList.remove("hidden");
      tray.innerHTML = "";
      trayWrap.classList.add("hidden");
      board.innerHTML = "";
      win.classList.add("hidden");
      win.classList.remove("flex");
    }

    function resetAll() {
      loadGen += 1;
      wipePuzzleState();
      fileInput.value = "";
      photoHint.classList.add("hidden");
      game.classList.add("hidden");
      setup.classList.remove("hidden");
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function squareSource(img) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const size = Math.min(iw, ih);
      const sx = (iw - size) / 2;
      const sy = (ih - size) / 2;
      const out = Math.min(1400, Math.max(480, size));
      const c = document.createElement("canvas");
      c.width = out;
      c.height = out;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, size, size, 0, 0, out, out);
      return c;
    }

    function knobbyEdge(ctx, x0, y0, x1, y1, sign, ts) {
      if (!sign) {
        ctx.lineTo(x1, y1);
        return;
      }
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.hypot(dx, dy);
      const ux = dx / len;
      const uy = dy / len;
      const nx = uy;
      const ny = -ux;
      function pt(t, o) {
        return [x0 + ux * len * t + nx * ts * o * sign, y0 + uy * len * t + ny * ts * o * sign];
      }
      const a = pt(0.34, 0);
      ctx.lineTo(a[0], a[1]);
      const b = pt(0.38, 0.08);
      const c = pt(0.27, 0.82);
      const d = pt(0.5, 1);
      ctx.bezierCurveTo(b[0], b[1], c[0], c[1], d[0], d[1]);
      const e = pt(0.73, 0.82);
      const f = pt(0.62, 0.08);
      const g = pt(0.66, 0);
      ctx.bezierCurveTo(e[0], e[1], f[0], f[1], g[0], g[1]);
      ctx.lineTo(x1, y1);
    }

    function piecePath(ctx, w, h, L, T, R, B, ts) {
      ctx.moveTo(0, 0);
      knobbyEdge(ctx, 0, 0, w, 0, T, ts);
      knobbyEdge(ctx, w, 0, w, h, R, ts);
      knobbyEdge(ctx, w, h, 0, h, B, ts);
      knobbyEdge(ctx, 0, h, 0, 0, L, ts);
      ctx.closePath();
    }

    function paintBevel(ctx, cellW, cellH, L, T, R, B, tab) {
      ctx.save();
      ctx.beginPath();
      piecePath(ctx, cellW, cellH, L, T, R, B, tab);
      ctx.clip();
      const vert = ctx.createLinearGradient(0, 0, 0, cellH);
      vert.addColorStop(0, "rgba(255,255,255,0.48)");
      vert.addColorStop(0.16, "rgba(255,255,255,0.16)");
      vert.addColorStop(0.48, "rgba(0,0,0,0)");
      vert.addColorStop(0.84, "rgba(0,0,0,0.16)");
      vert.addColorStop(1, "rgba(0,0,0,0.34)");
      ctx.fillStyle = vert;
      ctx.fillRect(-tab, -tab, cellW + 2 * tab, cellH + 2 * tab);
      const horz = ctx.createLinearGradient(0, 0, cellW, 0);
      horz.addColorStop(0, "rgba(255,255,255,0.22)");
      horz.addColorStop(0.18, "rgba(255,255,255,0)");
      horz.addColorStop(0.82, "rgba(0,0,0,0)");
      horz.addColorStop(1, "rgba(0,0,0,0.2)");
      ctx.fillStyle = horz;
      ctx.fillRect(-tab, -tab, cellW + 2 * tab, cellH + 2 * tab);
      ctx.restore();
    }

    function slicePhoto(img, r, c) {
      const size = img.width;
      const cellW = size / c;
      const cellH = size / r;
      const tab = Math.min(cellW, cellH) * 0.22;
      tabFracX = tab / cellW;
      tabFracY = tab / cellH;
      const rnd = mulberry32((size * 1103515245 + r * 997 + c * 7919) >>> 0);
      const rightTab = [];
      const bottomTab = [];
      for (let y = 0; y < r; y++) {
        rightTab[y] = [];
        bottomTab[y] = [];
        for (let x = 0; x < c; x++) {
          rightTab[y][x] = x < c - 1 ? (rnd() < 0.5 ? 1 : -1) : 0;
          bottomTab[y][x] = y < r - 1 ? (rnd() < 0.5 ? 1 : -1) : 0;
        }
      }
      const out = [];
      for (let y = 0; y < r; y++) {
        for (let x = 0; x < c; x++) {
          const L = x === 0 ? 0 : -rightTab[y][x - 1];
          const R = rightTab[y][x];
          const T = y === 0 ? 0 : -bottomTab[y - 1][x];
          const B = bottomTab[y][x];
          const cw = cellW + 2 * tab;
          const ch = cellH + 2 * tab;
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(2, Math.round(cw));
          canvas.height = Math.max(2, Math.round(ch));
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.scale(canvas.width / cw, canvas.height / ch);
          ctx.translate(tab, tab);
          ctx.save();
          ctx.beginPath();
          piecePath(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.clip();
          ctx.drawImage(img, 0, 0, size, size, -x * cellW, -y * cellH, size, size);
          ctx.restore();
          paintBevel(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.beginPath();
          piecePath(ctx, cellW, cellH, L, T, R, B, tab);
          ctx.strokeStyle = "rgba(16, 10, 24, 0.9)";
          ctx.lineWidth = Math.max(1.5, Math.min(cellW, cellH) * 0.024);
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();
          out.push({
            correct: y * c + x,
            row: y,
            col: x,
            src: canvas.toDataURL("image/png"),
            aw: canvas.width,
            ah: canvas.height
          });
        }
      }
      return out;
    }

    function smallPieceSize() {
      const slotW = (board.clientWidth || 280) / cols;
      const slotH = (board.clientHeight || 280) / rows;
      return Math.max(48, Math.min(76, Math.min(slotW, slotH) * 0.48));
    }

    function trayBoxFor(id, size) {
      const piece = catalog[id];
      const aspect = piece && piece.ah ? piece.aw / piece.ah : 1;
      if (aspect >= 1) return { w: size, h: size / aspect };
      return { w: size * aspect, h: size };
    }

    function trayCore(size) {
      const sample = trayIds[0] != null ? trayIds[0] : 0;
      const box = trayBoxFor(sample, size);
      return {
        w: box.w / (1 + 2 * tabFracX),
        h: box.h / (1 + 2 * tabFracY)
      };
    }

    function scatterPos(i, n) {
      const rnd = mulberry32((i + 1) * 9973 + n * 131 + i * 17 + Date.now());
      const size = smallPieceSize();
      const box = trayBoxFor(i, size);
      const tw = Math.max(160, tray.clientWidth || 300);
      const rowsFit = n > 12 ? 3 : n > 6 ? 2 : 1;
      const h = Math.max(160, Math.round(size * (rowsFit + 1.1)));
      tray.style.minHeight = h + "px";
      trayWrap.style.minHeight = h + "px";
      const maxL = Math.max(8, tw - box.w - 36);
      const maxT = Math.max(8, h - box.h - 36);
      return {
        l: 8 + rnd() * maxL,
        t: 18 + rnd() * maxT,
        z: i + 1
      };
    }

    function layoutGroupInTray(id) {
      const mem = trayMembers(id);
      if (!mem.length) return;
      const root = find(id);
      const size = smallPieceSize();
      const core = trayCore(size);
      if (!groupPos[root]) groupPos[root] = scatterPos(mem[0], catalog.length);
      const anchor = mem.reduce((a, b) => (catalog[a].correct < catalog[b].correct ? a : b));
      mem.forEach((pid) => {
        const dx = catalog[pid].col - catalog[anchor].col;
        const dy = catalog[pid].row - catalog[anchor].row;
        const box = trayBoxFor(pid, size);
        const extraX = (box.w - core.w) / 2;
        const extraY = (box.h - core.h) / 2;
        const aBox = trayBoxFor(anchor, size);
        const aExtraX = (aBox.w - core.w) / 2;
        const aExtraY = (aBox.h - core.h) / 2;
        catalog[pid]._box = {
          l: groupPos[root].l + dx * core.w + extraX - aExtraX,
          t: groupPos[root].t + dy * core.h + extraY - aExtraY,
          w: box.w,
          h: box.h,
          z: groupPos[root].z
        };
      });
    }

    function takeFromTray(id) {
      membersOf(id).forEach((pid) => {
        trayIds = trayIds.filter((x) => x !== pid);
      });
      delete groupPos[find(id)];
    }

    function addGroupToTray(id, pos) {
      const mem = membersOf(id);
      mem.forEach((pid) => {
        const from = boardSlots.indexOf(pid);
        if (from >= 0) boardSlots[from] = null;
        if (trayIds.indexOf(pid) < 0) trayIds.push(pid);
      });
      const root = find(id);
      groupPos[root] = pos || scatterPos(mem[0], catalog.length);
      groupPos[root].z = ++zTop;
      layoutGroupInTray(id);
    }

    function groupTargets(grabbedId, slotIndex) {
      const mem = membersOf(grabbedId);
      const g = catalog[grabbedId];
      const s = rcOf(slotIndex);
      const out = [];
      for (let i = 0; i < mem.length; i++) {
        const id = mem[i];
        const tr = s.r + (catalog[id].row - g.row);
        const tc = s.c + (catalog[id].col - g.col);
        if (tr < 0 || tc < 0 || tr >= rows || tc >= cols) return null;
        const ti = tr * cols + tc;
        if (catalog[id].correct !== ti) return null;
        out.push({ id, ti });
      }
      return out;
    }

    function canLockGroup(grabbedId, slotIndex) {
      if (catalog[grabbedId].correct !== slotIndex) return false;
      const targets = groupTargets(grabbedId, slotIndex);
      if (!targets) return false;
      const mem = membersOf(grabbedId);
      for (let i = 0; i < targets.length; i++) {
        const occ = boardSlots[targets[i].ti];
        if (occ != null && mem.indexOf(occ) < 0) return false;
      }
      return true;
    }

    function lockGroupToBoard(grabbedId, slotIndex) {
      const targets = groupTargets(grabbedId, slotIndex);
      if (!targets || !canLockGroup(grabbedId, slotIndex)) return false;
      takeFromTray(grabbedId);
      targets.forEach(({ id, ti }) => {
        boardSlots[ti] = id;
      });
      targets.forEach(({ id, ti }) => {
        const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
        const p = rcOf(ti);
        dirs.forEach(([dr, dc]) => {
          const nr = p.r + dr;
          const nc = p.c + dc;
          if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) return;
          const ni = nr * cols + nc;
          const oid = boardSlots[ni];
          if (oid == null) return;
          if (catalog[oid].correct !== ni) return;
          if (areNeighbors(id, oid)) union(id, oid);
        });
      });
      return true;
    }

    function setGroupPosFromPiece(pid) {
      const root = find(pid);
      const mem = trayMembers(pid);
      if (!mem.length || !catalog[pid]._box) return;
      const anchor = mem.reduce((a, b) => (catalog[a].correct < catalog[b].correct ? a : b));
      const dx = catalog[pid].col - catalog[anchor].col;
      const dy = catalog[pid].row - catalog[anchor].row;
      const size = smallPieceSize();
      const core = trayCore(size);
      const box = catalog[pid]._box;
      const pBox = trayBoxFor(pid, size);
      const aBox = trayBoxFor(anchor, size);
      const extraX = (pBox.w - core.w) / 2;
      const extraY = (pBox.h - core.h) / 2;
      const aExtraX = (aBox.w - core.w) / 2;
      const aExtraY = (aBox.h - core.h) / 2;
      groupPos[root] = {
        l: box.l - dx * core.w - extraX + aExtraX,
        t: box.t - dy * core.h - extraY + aExtraY,
        z: (groupPos[root] && groupPos[root].z) || ++zTop
      };
    }

    function trySnapTray(movedId) {
      const size = smallPieceSize();
      const core = trayCore(size);
      const thresh = Math.min(core.w, core.h) * 0.48;
      let grew = true;
      while (grew) {
        grew = false;
        const mem = trayMembers(movedId);
        for (let i = 0; i < mem.length; i++) {
          const id = mem[i];
          layoutGroupInTray(id);
          const box = catalog[id]._box;
          for (let n = 0; n < catalog.length; n++) {
            if (trayIds.indexOf(n) < 0) continue;
            if (find(n) === find(id)) continue;
            if (!areNeighbors(id, n)) continue;
            layoutGroupInTray(n);
            const nb = catalog[n]._box;
            const wantDx = (catalog[id].col - catalog[n].col) * core.w;
            const wantDy = (catalog[id].row - catalog[n].row) * core.h;
            const idCx = box.l + box.w / 2;
            const idCy = box.t + box.h / 2;
            const nCx = nb.l + nb.w / 2;
            const nCy = nb.t + nb.h / 2;
            if (Math.hypot((idCx - nCx) - wantDx, (idCy - nCy) - wantDy) > thresh) continue;
            const rootM = find(id);
            if (!groupPos[rootM]) groupPos[rootM] = { l: 8, t: 8, z: ++zTop };
            groupPos[rootM].l += (nCx + wantDx) - idCx;
            groupPos[rootM].t += (nCy + wantDy) - idCy;
            layoutGroupInTray(id);
            union(n, id);
            setGroupPosFromPiece(n);
            groupPos[find(n)].z = ++zTop;
            layoutGroupInTray(find(n));
            grew = true;
            break;
          }
          if (grew) break;
        }
      }
    }

    function slotAtPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.closest ? el.closest(".slot") : null;
    }

    function clearDropTargets() {
      board.querySelectorAll(".slot.drop-target").forEach((el) => el.classList.remove("drop-target"));
    }

    function highlightTargets(grabbedId, slotIndex) {
      clearDropTargets();
      const targets = canLockGroup(grabbedId, slotIndex) ? groupTargets(grabbedId, slotIndex) : null;
      if (!targets) {
        const slot = board.querySelector('.slot[data-i="' + slotIndex + '"]');
        if (slot) slot.classList.add("drop-target");
        return;
      }
      targets.forEach(({ ti }) => {
        const slot = board.querySelector('.slot[data-i="' + ti + '"]');
        if (slot) slot.classList.add("drop-target");
      });
    }

    function renderBoard() {
      board.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
      board.style.gridTemplateRows = "repeat(" + rows + ", minmax(0, 1fr))";
      board.style.setProperty("--tabx", String(tabFracX));
      board.style.setProperty("--taby", String(tabFracY));
      board.innerHTML = "";
      boardSlots.forEach((pieceId, i) => {
        const cell = document.createElement("div");
        cell.className = "slot" + (pieceId == null ? "" : " filled");
        cell.dataset.i = String(i);
        if (pieceId != null) {
          const img = document.createElement("img");
          img.className = "piece";
          img.src = catalog[pieceId].src;
          img.alt = "";
          img.draggable = false;
          cell.appendChild(img);
        }
        board.appendChild(cell);
      });
    }

    function renderTray() {
      tray.innerHTML = "";
      if (phase !== "playing") return;
      const seen = {};
      trayIds.forEach((id) => {
        const root = find(id);
        if (seen[root]) return;
        seen[root] = true;
        layoutGroupInTray(id);
        const mem = trayMembers(id);
        mem.forEach((pid) => {
          const b = catalog[pid]._box;
          const img = document.createElement("img");
          img.className = "tray-piece";
          img.src = catalog[pid].src;
          img.alt = "";
          img.draggable = false;
          img.dataset.id = String(pid);
          img.style.left = b.l + "px";
          img.style.top = b.t + "px";
          img.style.width = b.w + "px";
          img.style.height = b.h + "px";
          img.style.zIndex = String(b.z);
          if (dragging && membersOf(dragging.id).indexOf(pid) >= 0) img.style.opacity = "0.2";
          img.addEventListener("pointerdown", (e) => onPointerDown(e, pid));
          tray.appendChild(img);
        });
      });
    }

    function render() {
      renderBoard();
      renderTray();
    }

    function pieceDisplay(id, cellW, cellH) {
      return {
        w: cellW * (1 + 2 * tabFracX),
        h: cellH * (1 + 2 * tabFracY),
        ox: cellW * tabFracX,
        oy: cellH * tabFracY
      };
    }

    function buildGhost(id, cellW, cellH) {
      clearGhost();
      ghost = document.createElement("div");
      ghost.className = "ghost";
      const mem = membersOf(id);
      const d = pieceDisplay(id, cellW, cellH);
      mem.forEach((pid) => {
        const dx = catalog[pid].col - catalog[id].col;
        const dy = catalog[pid].row - catalog[id].row;
        const img = document.createElement("img");
        img.src = catalog[pid].src;
        img.alt = "";
        img.style.width = d.w + "px";
        img.style.height = d.h + "px";
        img.style.left = (dx * cellW - d.ox) + "px";
        img.style.top = (dy * cellH - d.oy) + "px";
        ghost.appendChild(img);
      });
      document.body.appendChild(ghost);
    }

    function placeGhost(x, y, ox, oy) {
      if (!ghost) return;
      ghost.style.left = (x - ox) + "px";
      ghost.style.top = (y - oy) + "px";
    }

    function onPointerDown(e, id) {
      if (phase !== "playing" || won) return;
      if (e.button != null && e.button !== 0) return;
      if (dragging) return;
      e.preventDefault();
      const mem = trayMembers(id);
      if (!mem.length) return;
      layoutGroupInTray(id);
      const box = catalog[id]._box;
      const root = find(id);
      if (groupPos[root]) groupPos[root].z = ++zTop;
      const size = smallPieceSize();
      const core = trayCore(size);
      dragging = {
        id: id,
        pointerId: e.pointerId,
        ox: e.clientX - box.l,
        oy: e.clientY - box.t,
        startW: box.w,
        startH: box.h,
        coreW: core.w,
        coreH: core.h,
        moved: false,
        sx: e.clientX,
        sy: e.clientY
      };
      dragging.cellW = core.w;
      dragging.cellH = core.h;
      buildGhost(id, core.w, core.h);
      placeGhost(e.clientX, e.clientY, dragging.ox - core.w * tabFracX, dragging.oy - core.h * tabFracY);
      renderTray();
      window.addEventListener("pointermove", onWinPointerMove);
      window.addEventListener("pointerup", onWinPointerUp);
      window.addEventListener("pointercancel", onWinPointerUp);
    }

    function onWinPointerMove(e) {
      if (!dragging || e.pointerId !== dragging.pointerId) return;
      e.preventDefault();
      if (Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) > 10) dragging.moved = true;
      const slot = slotAtPoint(e.clientX, e.clientY);
      clearDropTargets();
      if (slot) {
        const slotIndex = Number(slot.dataset.i);
        highlightTargets(dragging.id, slotIndex);
        const sr = slot.getBoundingClientRect();
        if (dragging.cellW !== sr.width || dragging.cellH !== sr.height || !ghost) {
          dragging.cellW = sr.width;
          dragging.cellH = sr.height;
          buildGhost(dragging.id, sr.width, sr.height);
        }
        ghost.style.left = sr.left + "px";
        ghost.style.top = sr.top + "px";
      } else {
        if (dragging.cellW !== dragging.coreW || dragging.cellH !== dragging.coreH || !ghost) {
          dragging.cellW = dragging.coreW;
          dragging.cellH = dragging.coreH;
          buildGhost(dragging.id, dragging.coreW, dragging.coreH);
        }
        placeGhost(e.clientX, e.clientY, dragging.ox - dragging.coreW * tabFracX, dragging.oy - dragging.coreH * tabFracY);
      }
    }

    function endDrag(e) {
      if (!dragging || e.pointerId !== dragging.pointerId) return;
      window.removeEventListener("pointermove", onWinPointerMove);
      window.removeEventListener("pointerup", onWinPointerUp);
      window.removeEventListener("pointercancel", onWinPointerUp);
      const x = e.clientX;
      const y = e.clientY;
      const slot = slotAtPoint(x, y);
      const slotIndex = slot ? Number(slot.dataset.i) : -1;
      const id = dragging.id;
      const ox = dragging.ox;
      const oy = dragging.oy;
      clearDropTargets();
      clearGhost();
      dragging = null;
      let locked = false;
      if (slotIndex >= 0) {
        if (canLockGroup(id, slotIndex)) {
          locked = lockGroupToBoard(id, slotIndex);
        } else if (catalog[id].correct !== slotIndex) {
          showToast("Bu parça buraya kilitlenmez");
        }
      }
      if (!locked) {
        const tr = trayWrap.getBoundingClientRect();
        const root = find(id);
        if (!groupPos[root]) groupPos[root] = { l: 8, t: 8, z: ++zTop };
        if (x >= tr.left - 24 && x <= tr.right + 24 && y >= tr.top - 24 && y <= tr.bottom + 24) {
          groupPos[root].l = Math.max(4, Math.min(tr.width - 48, x - tr.left - ox));
          groupPos[root].t = Math.max(4, Math.min(tr.height - 48, y - tr.top - oy));
        }
        groupPos[root].z = ++zTop;
        layoutGroupInTray(id);
        setGroupPosFromPiece(id);
        trySnapTray(id);
      }
      render();
      checkWin();
    }

    function onWinPointerUp(e) {
      if (!dragging) return;
      endDrag(e);
    }

    function checkWin() {
      if (won || phase !== "playing" || !catalog.length) return;
      if (trayIds.length) return;
      if (!boardSlots.every((id, i) => id != null && catalog[id].correct === i)) return;
      won = true;
      win.classList.remove("hidden");
      win.classList.add("flex");
      clap();
    }

    function clap() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const dur = 0.18;
          const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let n = 0; n < data.length; n++) data[n] = (Math.random() * 2 - 1) * (1 - n / data.length);
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.frequency.value = 1800 + Math.random() * 1200;
          const gain = ctx.createGain();
          gain.gain.value = 0.22;
          src.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          src.start();
        }, i * 70);
      }
    }

    function startAssembled(n) {
      if (!sourceImg) {
        showToast("Önce fotoğraf seç");
        return;
      }
      const g = gridFor(n);
      rows = g[0];
      cols = g[1];
      catalog = slicePhoto(sourceImg, rows, cols);
      resetGroups();
      boardSlots = catalog.map((_, i) => i);
      trayIds = [];
      phase = "assembled";
      won = false;
      helpOn = false;
      helpImg.classList.add("hidden");
      helpBtn.textContent = "Yardım Göster";
      helpBtn.classList.add("hidden");
      playHint.classList.add("hidden");
      helpImg.src = sourceImg.toDataURL("image/jpeg", 0.88);
      shuffleBtn.classList.remove("hidden");
      trayWrap.classList.add("hidden");
      setup.classList.add("hidden");
      game.classList.remove("hidden");
      render();
    }

    function scatterPieces() {
      if (phase !== "assembled" || !catalog.length) return;
      boardSlots = catalog.map(() => null);
      parent = catalog.map((_, i) => i);
      trayIds = catalog.map((_, id) => id);
      groupPos = {};
      catalog.forEach((_, id) => {
        groupPos[id] = scatterPos(id, catalog.length);
      });
      phase = "playing";
      won = false;
      shuffleBtn.classList.add("hidden");
      trayWrap.classList.remove("hidden");
      helpBtn.classList.remove("hidden");
      playHint.classList.remove("hidden");
      render();
    }

    document.addEventListener("touchmove", (e) => {
      if (dragging) e.preventDefault();
    }, { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());

    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      const gen = ++loadGen;
      wipePuzzleState();
      photoHint.classList.add("hidden");
      game.classList.add("hidden");
      setup.classList.remove("hidden");
      photoUrl = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        if (gen !== loadGen) return;
        const cropped = squareSource(img);
        if (photoUrl) URL.revokeObjectURL(photoUrl);
        photoUrl = "";
        if (gen !== loadGen) return;
        sourceImg = cropped;
        helpImg.removeAttribute("src");
        helpImg.src = cropped.toDataURL("image/jpeg", 0.88);
        photoHint.classList.remove("hidden");
      };
      img.onerror = () => {
        if (gen !== loadGen) return;
        showToast("Fotoğraf okunamadı");
        wipePuzzleState();
      };
      img.src = photoUrl;
    });
    document.querySelectorAll(".piece-btn").forEach((btn) => {
      btn.addEventListener("click", () => startAssembled(Number(btn.dataset.n)));
    });
    shuffleBtn.addEventListener("click", scatterPieces);
    helpBtn.addEventListener("click", () => {
      helpOn = !helpOn;
      helpImg.classList.toggle("hidden", !helpOn);
      helpBtn.textContent = helpOn ? "Yardımı Gizle" : "Yardım Göster";
    });
    resetBtn.addEventListener("click", resetAll);
    document.getElementById("winOk").addEventListener("click", () => {
      win.classList.add("hidden");
      win.classList.remove("flex");
    });
  </script>
</body>
</html>
