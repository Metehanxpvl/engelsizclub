<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="Engelsiz Boyama — galeriden fotoğrafı boyama kalıbına çevir." />
  <title>Engelsiz Boyama — Engelsiz Club</title>
  <style>
    :root {
      --fg: #0f2f24;
      --muted: #5a7168;
      --bg: #f4faf7;
      --card: #ffffff;
      --accent: #1a6b4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px 8px;
      text-align: center;
    }
    header a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }
    h1 {
      margin: 6px 0 4px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
    }
    .swatch, .size, button {
      border: 2px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .swatch {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      filter: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .swatch.active { border-color: var(--fg); }
    .size {
      width: 32px;
      height: 32px;
      background: #fff;
      color: var(--fg);
      font-weight: 800;
      font-size: 0.75rem;
    }
    .size.active { border-color: var(--accent); color: var(--accent); }
    button.action {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
    }
    button.action:disabled { opacity: 0.6; cursor: wait; }
    #wrap {
      flex: 1;
      min-height: 0;
      padding: 0 12px 16px;
      position: relative;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      background: #fff;
    }
    #paint, #lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #lines {
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    #busy {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.72);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-weight: 700;
      color: var(--accent);
      z-index: 2;
      padding: 16px;
      text-align: center;
    }
    #busy.on { display: flex; }
    #busy-retry {
      display: none;
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
    }
    #busy.error #busy-retry { display: inline-block; }
  </style>
</head>
<body>
  <header>
    <a href="/">← Engelsiz Club</a>
    <h1>🎨 Engelsiz Boyama</h1>
    <p class="sub">Galeriden fotoğraf seç; boyama kalıbı hazırlanır. Sonra boya.</p>
  </header>
  <div class="tools" id="tools">
    <input type="file" id="photo" accept="image/*" hidden />
    <button type="button" class="action" id="pick">Galeriden seç</button>
    <button type="button" class="swatch active" data-color="#e31b23" style="background:#e31b23" aria-label="Kırmızı"></button>
    <button type="button" class="swatch" data-color="#ffd400" style="background:#ffd400" aria-label="Sarı"></button>
    <button type="button" class="swatch" data-color="#1565c0" style="background:#1565c0" aria-label="Mavi"></button>
    <button type="button" class="swatch" data-color="#ff7a18" style="background:#ff7a18" aria-label="Turuncu"></button>
    <button type="button" class="swatch" data-color="#2e9b3a" style="background:#2e9b3a" aria-label="Yeşil"></button>
    <button type="button" class="swatch" data-color="#8e24aa" style="background:#8e24aa" aria-label="Mor"></button>
    <button type="button" class="swatch" data-color="#f06292" style="background:#f06292" aria-label="Pembe"></button>
    <button type="button" class="swatch" data-color="#8d5b3d" style="background:#8d5b3d" aria-label="Kahverengi"></button>
    <button type="button" class="swatch" data-color="#e8b89a" style="background:#e8b89a" aria-label="Ten"></button>
    <button type="button" class="swatch" data-color="#9e9e9e" style="background:#9e9e9e" aria-label="Gri"></button>
    <button type="button" class="swatch" data-color="#111111" style="background:#111111" aria-label="Siyah"></button>
    <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff;border-color:#ccc" aria-label="Silgi"></button>
    <button type="button" class="size active" data-size="8">S</button>
    <button type="button" class="size" data-size="18">M</button>
    <button type="button" class="size" data-size="32">L</button>
    <button type="button" class="action" id="clear">Temizle</button>
  </div>
  <div id="wrap">
    <div id="stage">
      <canvas id="paint" aria-label="Boyama alanı"></canvas>
      <canvas id="lines" aria-hidden="true"></canvas>
      <div id="busy">
        <div id="busy-msg">Boyama sayfası hazırlanıyor…</div>
        <button type="button" id="busy-retry">Tekrar dene</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // Boyama kalıbı tamamen tarayıcıda üretilir — görsel üretim servisi yok.
      // Kural: beyaz zemin + ince siyah çizgi. Koyu alanlar doldurulmaz;
      // yalnız sınırı çizilir. Değerler lib/pages/boyama_line_art.dart ile aynı.
      var MIN_BLACK = 0.05;
      var MAX_BLACK = 0.12;
      var MAX_SIDE = 900;
      // [ton seviyesi, en düşük kenar kontrastı, en küçük bölge oranı]
      var STEPS = [
        [7, 14, 0.00010],
        [7, 22, 0.00018],
        [6, 32, 0.00035],
        [6, 46, 0.00080],
        [5, 64, 0.00200],
        [4, 90, 0.00600]
      ];

      var paint = document.getElementById('paint');
      var lines = document.getElementById('lines');
      var pctx = paint.getContext('2d', { willReadFrequently: false });
      var lctx = lines.getContext('2d', { willReadFrequently: true });
      var color = '#e31b23';
      var size = 8;
      var drawing = false;
      var lineArt = null;
      var busy = false;
      var lastFile = null;

      function cssSize(el) {
        var r = el.getBoundingClientRect();
        return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
      }

      function resizeCanvas(cv, ctx, fillWhite) {
        var stage = document.getElementById('stage');
        var s = cssSize(stage);
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        cv.width = Math.floor(s.w * dpr);
        cv.height = Math.floor(s.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (fillWhite) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, s.w, s.h);
        } else {
          ctx.clearRect(0, 0, s.w, s.h);
        }
      }

      function drawLineArt() {
        var s = cssSize(document.getElementById('stage'));
        lctx.setTransform(1, 0, 0, 1, 0, 0);
        lctx.clearRect(0, 0, lines.width, lines.height);
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!lineArt) return;
        var scale = Math.min(s.w / lineArt.width, s.h / lineArt.height);
        var dw = lineArt.width * scale;
        var dh = lineArt.height * scale;
        var x = (s.w - dw) / 2;
        var y = (s.h - dh) / 2;
        lctx.imageSmoothingEnabled = false;
        lctx.drawImage(lineArt, x, y, dw, dh);
      }

      function resize() {
        resizeCanvas(paint, pctx, true);
        resizeCanvas(lines, lctx, false);
        drawLineArt();
      }
      resize();
      window.addEventListener('resize', resize);

      function pos(e) {
        var r = paint.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      function start(e) {
        if (busy) return;
        drawing = true;
        var p = pos(e);
        pctx.beginPath();
        pctx.moveTo(p.x, p.y);
        e.preventDefault();
      }
      function move(e) {
        if (!drawing) return;
        var p = pos(e);
        pctx.strokeStyle = color;
        pctx.lineWidth = size;
        pctx.lineTo(p.x, p.y);
        pctx.stroke();
        e.preventDefault();
      }
      function end() { drawing = false; }

      paint.addEventListener('pointerdown', start);
      paint.addEventListener('pointermove', move);
      paint.addEventListener('pointerup', end);
      paint.addEventListener('pointerleave', end);
      paint.addEventListener('touchstart', start, { passive: false });
      paint.addEventListener('touchmove', move, { passive: false });
      paint.addEventListener('touchend', end);

      document.getElementById('tools').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.color) {
          color = btn.dataset.color;
          document.querySelectorAll('.swatch').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        } else if (btn.dataset.size) {
          size = Number(btn.dataset.size);
          document.querySelectorAll('.size').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        }
      });
      document.getElementById('clear').addEventListener('click', function () {
        resizeCanvas(paint, pctx, true);
      });

      function setBusy(on, msg, isError) {
        busy = on;
        var el = document.getElementById('busy');
        el.classList.toggle('on', on);
        el.classList.toggle('error', !!isError);
        if (msg) document.getElementById('busy-msg').textContent = msg;
        document.getElementById('pick').disabled = on && !isError;
      }

      function loadImageFile(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var im = new Image();
          im.onload = function () {
            URL.revokeObjectURL(url);
            resolve(im);
          };
          im.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('Görsel okunamadı'));
          };
          im.src = url;
        });
      }

      function clampInt(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      // Ayrılabilir kutu bulanıklığı (kayan toplam). Doku/gürültü çizgiye dönüşmesin.
      function boxBlur(src, w, h, radius, passes) {
        var cur = src.slice();
        var tmp = new Uint8Array(w * h);
        var n = radius * 2 + 1;
        var pass, x, y, i, row, sum;
        for (pass = 0; pass < passes; pass++) {
          for (y = 0; y < h; y++) {
            row = y * w;
            sum = 0;
            for (i = -radius; i <= radius; i++) sum += cur[row + clampInt(i, 0, w - 1)];
            for (x = 0; x < w; x++) {
              tmp[row + x] = (sum / n) | 0;
              sum += cur[row + clampInt(x + radius + 1, 0, w - 1)] -
                cur[row + clampInt(x - radius, 0, w - 1)];
            }
          }
          for (x = 0; x < w; x++) {
            sum = 0;
            for (i = -radius; i <= radius; i++) sum += tmp[clampInt(i, 0, h - 1) * w + x];
            for (y = 0; y < h; y++) {
              cur[y * w + x] = (sum / n) | 0;
              sum += tmp[clampInt(y + radius + 1, 0, h - 1) * w + x] -
                tmp[clampInt(y - radius, 0, h - 1) * w + x];
            }
          }
        }
        return cur;
      }

      // %2–%98 aralığını 0–255'e yay: az kontrastlı karede çizgi kaybolmasın.
      function stretchContrast(gray) {
        var hist = new Int32Array(256);
        var i;
        for (i = 0; i < gray.length; i++) hist[gray[i]]++;
        var cut = Math.round(gray.length * 0.02);
        var acc = 0;
        var lo = 0;
        for (i = 0; i < 256; i++) { acc += hist[i]; if (acc >= cut) { lo = i; break; } }
        acc = 0;
        var hi = 255;
        for (i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= cut) { hi = i; break; } }
        if (hi - lo < 16) return;
        var scale = 255 / (hi - lo);
        for (i = 0; i < gray.length; i++) {
          var v = Math.round((gray[i] - lo) * scale);
          gray[i] = v < 0 ? 0 : (v > 255 ? 255 : v);
        }
      }

      function quantize(gray, levels) {
        var out = new Uint8Array(gray.length);
        for (var i = 0; i < gray.length; i++) {
          var v = (gray[i] * levels / 256) | 0;
          if (v >= levels) v = levels - 1;
          out[i] = v;
        }
        return out;
      }

      // Küçük lekeleri en büyük komşusuna kat: fotoğraf karalamaya dönmesin,
      // bölgeler boyanabilecek kadar geniş ve kapalı kalsın.
      function mergeSmallRegions(q, w, h, minArea) {
        for (var pass = 0; pass < 2; pass++) {
          if (!mergePass(q, w, h, minArea)) break;
        }
      }

      function mergePass(q, w, h, minArea) {
        var n = w * h;
        var labels = new Int32Array(n).fill(-1);
        var stack = new Int32Array(n);
        var areas = [];
        var values = [];
        var next = 0;
        var start, idx, x, sp, count, value, label;
        for (start = 0; start < n; start++) {
          if (labels[start] !== -1) continue;
          value = q[start];
          label = next++;
          sp = 0;
          stack[sp++] = start;
          labels[start] = label;
          count = 0;
          while (sp > 0) {
            idx = stack[--sp];
            count++;
            x = idx % w;
            if (x > 0 && labels[idx - 1] === -1 && q[idx - 1] === value) {
              labels[idx - 1] = label; stack[sp++] = idx - 1;
            }
            if (x < w - 1 && labels[idx + 1] === -1 && q[idx + 1] === value) {
              labels[idx + 1] = label; stack[sp++] = idx + 1;
            }
            if (idx >= w && labels[idx - w] === -1 && q[idx - w] === value) {
              labels[idx - w] = label; stack[sp++] = idx - w;
            }
            if (idx < n - w && labels[idx + w] === -1 && q[idx + w] === value) {
              labels[idx + w] = label; stack[sp++] = idx + w;
            }
          }
          areas.push(count);
          values.push(value);
        }

        var bestLabel = new Int32Array(next).fill(-1);
        var bestArea = new Int32Array(next);
        var l, m;
        for (idx = 0; idx < n; idx++) {
          l = labels[idx];
          if (areas[l] >= minArea) continue;
          x = idx % w;
          if (x > 0) {
            m = labels[idx - 1];
            if (m !== l && areas[m] > bestArea[l]) { bestArea[l] = areas[m]; bestLabel[l] = m; }
          }
          if (x < w - 1) {
            m = labels[idx + 1];
            if (m !== l && areas[m] > bestArea[l]) { bestArea[l] = areas[m]; bestLabel[l] = m; }
          }
          if (idx >= w) {
            m = labels[idx - w];
            if (m !== l && areas[m] > bestArea[l]) { bestArea[l] = areas[m]; bestLabel[l] = m; }
          }
          if (idx < n - w) {
            m = labels[idx + w];
            if (m !== l && areas[m] > bestArea[l]) { bestArea[l] = areas[m]; bestLabel[l] = m; }
          }
        }

        var changed = false;
        for (idx = 0; idx < n; idx++) {
          l = labels[idx];
          if (areas[l] >= minArea) continue;
          m = bestLabel[l];
          if (m < 0) continue;
          q[idx] = values[m];
          changed = true;
        }
        return changed;
      }

      // Merkezi fark ile eğim şiddeti (|dx| + |dy|).
      function gradient(gray, w, h) {
        var out = new Uint8Array(w * h);
        for (var y = 1; y < h - 1; y++) {
          for (var x = 1; x < w - 1; x++) {
            var i = y * w + x;
            var g = Math.abs(gray[i + 1] - gray[i - 1]) +
              Math.abs(gray[i + w] - gray[i - w]);
            out[i] = g > 255 ? 255 : g;
          }
        }
        return out;
      }

      // Yalnız bölge sınırı siyah olur; bölgenin içi hiç boyanmaz.
      // Sınır ancak gerçek kontrast varsa çizilir — yumuşak ton geçişi çizgi değil.
      function edgeMask(q, grad, minEdge, w, h) {
        var n = w * h;
        var out = new Uint8Array(n).fill(255);
        for (var y = 0; y < h - 1; y++) {
          for (var x = 0; x < w - 1; x++) {
            var i = y * w + x;
            var c = q[i];
            if (q[i + 1] === c && q[i + w] === c) continue;
            if (grad[i] < minEdge) continue;
            out[i] = 0;
          }
        }
        return out;
      }

      // Kopuk kısa parçaları sil (toz/gürültü). Göz, ağız gibi küçük ama
      // anlamlı ayrıntılar kalsın diye eşik düşük tutulur.
      function pruneSpecks(mask, w, h, minSize) {
        var n = w * h;
        var seen = new Uint8Array(n);
        var stack = new Int32Array(n);
        var comp = new Int32Array(n);
        var start, idx, sp, cp, x, y, dx, dy, nx, ny, k, i;
        for (start = 0; start < n; start++) {
          if (mask[start] !== 0 || seen[start] !== 0) continue;
          sp = 0; cp = 0;
          stack[sp++] = start;
          seen[start] = 1;
          while (sp > 0) {
            idx = stack[--sp];
            comp[cp++] = idx;
            x = idx % w;
            y = (idx / w) | 0;
            for (dy = -1; dy <= 1; dy++) {
              ny = y + dy;
              if (ny < 0 || ny >= h) continue;
              for (dx = -1; dx <= 1; dx++) {
                nx = x + dx;
                if (nx < 0 || nx >= w) continue;
                k = ny * w + nx;
                if (seen[k] !== 0 || mask[k] !== 0) continue;
                seen[k] = 1;
                stack[sp++] = k;
              }
            }
          }
          if (cp < minSize) {
            for (i = 0; i < cp; i++) mask[comp[i]] = 255;
          }
        }
      }

      function dilate(mask, w, h) {
        var out = mask.slice();
        for (var y = 0; y < h; y++) {
          for (var x = 0; x < w; x++) {
            var i = y * w + x;
            if (mask[i] !== 0) continue;
            if (x > 0) out[i - 1] = 0;
            if (x < w - 1) out[i + 1] = 0;
            if (y > 0) out[i - w] = 0;
            if (y < h - 1) out[i + w] = 0;
          }
        }
        return out;
      }

      function blackRatio(mask) {
        var black = 0;
        for (var i = 0; i < mask.length; i++) if (mask[i] === 0) black++;
        return mask.length ? black / mask.length : 0;
      }

      function photoToColoring(im) {
        var scale = Math.min(1, MAX_SIDE / Math.max(im.width, im.height));
        var w = Math.max(2, Math.round(im.width * scale));
        var h = Math.max(2, Math.round(im.height * scale));
        var n = w * h;
        var off = document.createElement('canvas');
        off.width = w;
        off.height = h;
        var ox = off.getContext('2d', { willReadFrequently: true });
        ox.fillStyle = '#fff';
        ox.fillRect(0, 0, w, h);
        ox.drawImage(im, 0, 0, w, h);
        var data = ox.getImageData(0, 0, w, h);
        var d = data.data;
        var gray = new Uint8Array(n);
        var i, o, lum;
        for (i = 0; i < n; i++) {
          o = i * 4;
          lum = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
          gray[i] = lum < 0 ? 0 : (lum > 255 ? 255 : Math.round(lum));
        }
        var smooth = boxBlur(gray, w, h, 2, 2);
        stretchContrast(smooth);
        var grad = gradient(smooth, w, h);

        var speck = Math.max(10, Math.round(Math.min(w, h) * 0.025));
        var mask = new Uint8Array(n).fill(255);
        var ratio = 1;
        for (var s = 0; s < STEPS.length; s++) {
          var q = quantize(smooth, STEPS[s][0]);
          mergeSmallRegions(q, w, h, Math.max(32, Math.round(n * STEPS[s][2])));
          var edges = edgeMask(q, grad, STEPS[s][1], w, h);
          pruneSpecks(edges, w, h, speck);
          mask = edges;
          ratio = blackRatio(edges);
          if (ratio <= MAX_BLACK) break;
        }
        // Çizgi 1 px; yalnız fazla soluk kaldıysa ve üst sınırı aşmıyorsa kalınlaşır.
        if (ratio < MIN_BLACK) {
          var thick = dilate(mask, w, h);
          if (blackRatio(thick) <= MAX_BLACK) mask = thick;
        }
        for (i = 0; i < n; i++) {
          var v = mask[i];
          o = i * 4;
          d[o] = v; d[o + 1] = v; d[o + 2] = v; d[o + 3] = 255;
        }
        ox.putImageData(data, 0, 0);
        return off;
      }

      function convertFile(file) {
        setBusy(true, 'Boyama sayfası hazırlanıyor…', false);
        return loadImageFile(file)
          .then(function (im) {
            // Bir kare bekle ki "hazırlanıyor" katmanı çizim bloklanmadan görünsün.
            return new Promise(function (resolve) {
              setTimeout(function () { resolve(photoToColoring(im)); }, 32);
            });
          })
          .then(function (art) {
            lineArt = art;
            resizeCanvas(paint, pctx, true);
            drawLineArt();
            setBusy(false, '', false);
          })
          .catch(function () {
            setBusy(true, 'Resim eklenemedi. JPEG veya PNG dene.', true);
          });
      }

      document.getElementById('pick').addEventListener('click', function () {
        if (busy && !document.getElementById('busy').classList.contains('error')) return;
        document.getElementById('photo').click();
      });

      document.getElementById('busy-retry').addEventListener('click', function () {
        if (!lastFile) return;
        convertFile(lastFile);
      });

      document.getElementById('photo').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        lastFile = file;
        convertFile(file);
      });
    })();
  </script>
</body>
</html>
