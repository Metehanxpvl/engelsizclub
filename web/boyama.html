<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="Engelsiz Boyama — galeriden fotoğrafı boyama kalıbına çevir." />
  <title>Engelsiz Boyama — Engelsiz Club</title>
  <style>
    :root {
      --fg: #0f2f24;
      --muted: #5a7168;
      --bg: #f4faf7;
      --card: #ffffff;
      --accent: #1a6b4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px 8px;
      text-align: center;
    }
    header a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }
    h1 {
      margin: 6px 0 4px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
    }
    .swatch, .size, button {
      border: 2px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .swatch {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      filter: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .swatch.active { border-color: var(--fg); }
    .size {
      width: 32px;
      height: 32px;
      background: #fff;
      color: var(--fg);
      font-weight: 800;
      font-size: 0.75rem;
    }
    .size.active { border-color: var(--accent); color: var(--accent); }
    button.action {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
    }
    button.action:disabled { opacity: 0.6; cursor: wait; }
    #wrap {
      flex: 1;
      min-height: 0;
      padding: 0 12px 16px;
      position: relative;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      background: #fff;
    }
    #paint, #lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #lines {
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    #busy {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.72);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-weight: 700;
      color: var(--accent);
      z-index: 2;
      padding: 16px;
      text-align: center;
    }
    #busy.on { display: flex; }
    #busy-retry {
      display: none;
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
    }
    #busy.error #busy-retry { display: inline-block; }
  </style>
</head>
<body>
  <header>
    <a href="/">← Engelsiz Club</a>
    <h1>🎨 Engelsiz Boyama</h1>
    <p class="sub">Galeriden fotoğraf seç; boyama kalıbı hazırlanır. Sonra boya.</p>
  </header>
  <div class="tools" id="tools">
    <input type="file" id="photo" accept="image/*" hidden />
    <button type="button" class="action" id="pick">Galeriden seç</button>
    <button type="button" class="swatch active" data-color="#e31b23" style="background:#e31b23" aria-label="Kırmızı"></button>
    <button type="button" class="swatch" data-color="#ffd400" style="background:#ffd400" aria-label="Sarı"></button>
    <button type="button" class="swatch" data-color="#1565c0" style="background:#1565c0" aria-label="Mavi"></button>
    <button type="button" class="swatch" data-color="#ff7a18" style="background:#ff7a18" aria-label="Turuncu"></button>
    <button type="button" class="swatch" data-color="#2e9b3a" style="background:#2e9b3a" aria-label="Yeşil"></button>
    <button type="button" class="swatch" data-color="#8e24aa" style="background:#8e24aa" aria-label="Mor"></button>
    <button type="button" class="swatch" data-color="#f06292" style="background:#f06292" aria-label="Pembe"></button>
    <button type="button" class="swatch" data-color="#8d5b3d" style="background:#8d5b3d" aria-label="Kahverengi"></button>
    <button type="button" class="swatch" data-color="#e8b89a" style="background:#e8b89a" aria-label="Ten"></button>
    <button type="button" class="swatch" data-color="#9e9e9e" style="background:#9e9e9e" aria-label="Gri"></button>
    <button type="button" class="swatch" data-color="#111111" style="background:#111111" aria-label="Siyah"></button>
    <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff;border-color:#ccc" aria-label="Silgi"></button>
    <button type="button" class="size active" data-size="8">S</button>
    <button type="button" class="size" data-size="18">M</button>
    <button type="button" class="size" data-size="32">L</button>
    <button type="button" class="action" id="clear">Temizle</button>
  </div>
  <div id="wrap">
    <div id="stage">
      <canvas id="paint" aria-label="Boyama alanı"></canvas>
      <canvas id="lines" aria-hidden="true"></canvas>
      <div id="busy">
        <div id="busy-msg">Çizgi filme çevriliyor…</div>
        <button type="button" id="busy-retry">Tekrar dene</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var SUPABASE_URL = 'https://qycrkqwqrysypvqaipqn.supabase.co';
      var SUPABASE_ANON = 'sb_publishable_N7UfnXDF97YsuDTsFTq9zQ_lhnNtMgF';
      var CARTOON_PROMPT =
        "Redraw this photograph as a friendly children's cartoon illustration " +
        'in a 2D animated movie style. Original character, not a known franchise. ' +
        'Keep the same person, pose, clothing, and setting, but stylize them: ' +
        'big expressive eyes, clean simple shapes, soft rounded features, ' +
        'smooth flat colors, warm and kind. Not photorealistic, not horror, ' +
        'not grotesque, not uncanny, not a pencil sketch of a real face. ' +
        'No logos, no copyrighted characters, no watermarks, no text overlay.';

      var paint = document.getElementById('paint');
      var lines = document.getElementById('lines');
      var pctx = paint.getContext('2d', { willReadFrequently: false });
      var lctx = lines.getContext('2d', { willReadFrequently: true });
      var color = '#e31b23';
      var size = 8;
      var drawing = false;
      var lineArt = null;
      var busy = false;
      var lastJpeg = null;
      var lastAspect = '1:1';

      function cssSize(el) {
        var r = el.getBoundingClientRect();
        return { w: Math.max(1, r.width), h: Math.max(1, r.height) };
      }

      function resizeCanvas(cv, ctx, fillWhite) {
        var stage = document.getElementById('stage');
        var s = cssSize(stage);
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        cv.width = Math.floor(s.w * dpr);
        cv.height = Math.floor(s.h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (fillWhite) {
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, s.w, s.h);
        } else {
          ctx.clearRect(0, 0, s.w, s.h);
        }
      }

      function drawLineArt() {
        var s = cssSize(document.getElementById('stage'));
        lctx.setTransform(1, 0, 0, 1, 0, 0);
        lctx.clearRect(0, 0, lines.width, lines.height);
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (!lineArt) return;
        var scale = Math.min(s.w / lineArt.width, s.h / lineArt.height);
        var dw = lineArt.width * scale;
        var dh = lineArt.height * scale;
        var x = (s.w - dw) / 2;
        var y = (s.h - dh) / 2;
        lctx.imageSmoothingEnabled = false;
        lctx.drawImage(lineArt, x, y, dw, dh);
      }

      function resize() {
        resizeCanvas(paint, pctx, true);
        resizeCanvas(lines, lctx, false);
        drawLineArt();
      }
      resize();
      window.addEventListener('resize', resize);

      function pos(e) {
        var r = paint.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      function start(e) {
        if (busy) return;
        drawing = true;
        var p = pos(e);
        pctx.beginPath();
        pctx.moveTo(p.x, p.y);
        e.preventDefault();
      }
      function move(e) {
        if (!drawing) return;
        var p = pos(e);
        pctx.strokeStyle = color;
        pctx.lineWidth = size;
        pctx.lineTo(p.x, p.y);
        pctx.stroke();
        e.preventDefault();
      }
      function end() { drawing = false; }

      paint.addEventListener('pointerdown', start);
      paint.addEventListener('pointermove', move);
      paint.addEventListener('pointerup', end);
      paint.addEventListener('pointerleave', end);
      paint.addEventListener('touchstart', start, { passive: false });
      paint.addEventListener('touchmove', move, { passive: false });
      paint.addEventListener('touchend', end);

      document.getElementById('tools').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.color) {
          color = btn.dataset.color;
          document.querySelectorAll('.swatch').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        } else if (btn.dataset.size) {
          size = Number(btn.dataset.size);
          document.querySelectorAll('.size').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        }
      });
      document.getElementById('clear').addEventListener('click', function () {
        resizeCanvas(paint, pctx, true);
      });

      function setBusy(on, msg, isError) {
        busy = on;
        var el = document.getElementById('busy');
        el.classList.toggle('on', on);
        el.classList.toggle('error', !!isError);
        if (msg) document.getElementById('busy-msg').textContent = msg;
        document.getElementById('pick').disabled = on && !isError;
      }

      function aspectFor(w, h) {
        if (!(w > 0) || !(h > 0)) return '1:1';
        var r = w / h;
        var opts = [
          [1, '1:1'], [4 / 3, '4:3'], [3 / 4, '3:4'],
          [16 / 9, '16:9'], [9 / 16, '9:16'], [3 / 2, '3:2'], [2 / 3, '2:3']
        ];
        var best = '1:1';
        var bestDiff = 999;
        for (var i = 0; i < opts.length; i++) {
          var d = Math.abs(r - opts[i][0]);
          if (d < bestDiff) { bestDiff = d; best = opts[i][1]; }
        }
        return best;
      }

      function loadImageFile(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file);
          var im = new Image();
          im.onload = function () {
            URL.revokeObjectURL(url);
            resolve(im);
          };
          im.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error('Görsel okunamadı'));
          };
          im.src = url;
        });
      }

      function loadImageSrc(src) {
        return new Promise(function (resolve, reject) {
          var im = new Image();
          im.onload = function () { resolve(im); };
          im.onerror = function () { reject(new Error('Görsel okunamadı')); };
          im.src = src;
        });
      }

      function fileToJpeg(file) {
        return loadImageFile(file).then(function (im) {
          var maxSide = 768;
          var scale = Math.min(1, maxSide / Math.max(im.width, im.height));
          var w = Math.max(2, Math.round(im.width * scale));
          var h = Math.max(2, Math.round(im.height * scale));
          var off = document.createElement('canvas');
          off.width = w;
          off.height = h;
          var ox = off.getContext('2d');
          ox.fillStyle = '#fff';
          ox.fillRect(0, 0, w, h);
          ox.drawImage(im, 0, 0, w, h);
          var dataUrl = off.toDataURL('image/jpeg', 0.78);
          var comma = dataUrl.indexOf('base64,');
          return {
            b64: comma >= 0 ? dataUrl.slice(comma + 7) : dataUrl,
            aspect: aspectFor(w, h)
          };
        });
      }

      function blurCanvas(srcCanvas, passes) {
        var w = srcCanvas.width;
        var h = srcCanvas.height;
        var a = document.createElement('canvas');
        a.width = w;
        a.height = h;
        var b = document.createElement('canvas');
        b.width = w;
        b.height = h;
        var ax = a.getContext('2d', { willReadFrequently: true });
        var bx = b.getContext('2d', { willReadFrequently: true });
        ax.drawImage(srcCanvas, 0, 0);
        var from = a;
        var to = b;
        var fx = ax;
        var tx = bx;
        var p, x, y, i, o, r, g, bl, n;
        for (p = 0; p < passes; p++) {
          var data = fx.getImageData(0, 0, w, h);
          var d = data.data;
          var out = tx.createImageData(w, h);
          var od = out.data;
          for (y = 1; y < h - 1; y++) {
            for (x = 1; x < w - 1; x++) {
              o = (y * w + x) * 4;
              r = g = bl = 0;
              n = 0;
              for (var dy = -1; dy <= 1; dy++) {
                for (var dx = -1; dx <= 1; dx++) {
                  i = ((y + dy) * w + (x + dx)) * 4;
                  r += d[i];
                  g += d[i + 1];
                  bl += d[i + 2];
                  n++;
                }
              }
              od[o] = (r / n) | 0;
              od[o + 1] = (g / n) | 0;
              od[o + 2] = (bl / n) | 0;
              od[o + 3] = 255;
            }
          }
          tx.putImageData(out, 0, 0);
          var tmp = from; from = to; to = tmp;
          tmp = fx; fx = tx; tx = tmp;
        }
        return from;
      }

      function posterizeToColoring(im, opts) {
        var maxSide = opts.maxSide || 960;
        var step = opts.step || 36;
        var fillVeryDark = !!opts.fillVeryDark;
        var blurPasses = opts.blurPasses || 0;
        var scale = Math.min(1, maxSide / Math.max(im.width, im.height));
        var w = Math.max(2, Math.round(im.width * scale));
        var h = Math.max(2, Math.round(im.height * scale));
        var off = document.createElement('canvas');
        off.width = w;
        off.height = h;
        var ox = off.getContext('2d', { willReadFrequently: true });
        ox.fillStyle = '#fff';
        ox.fillRect(0, 0, w, h);
        ox.drawImage(im, 0, 0, w, h);
        if (blurPasses > 0) {
          var blurred = blurCanvas(off, blurPasses);
          ox.clearRect(0, 0, w, h);
          ox.drawImage(blurred, 0, 0);
        }
        var data = ox.getImageData(0, 0, w, h);
        var d = data.data;
        function qv(v) { return Math.round(v / step) * step; }
        function pack(i) {
          return (qv(d[i]) << 16) | (qv(d[i + 1]) << 8) | qv(d[i + 2]);
        }
        var out = new Uint8ClampedArray(w * h);
        var x, y, i, o, lum, c, edge;
        for (i = 0; i < w * h; i++) out[i] = 255;
        for (y = 1; y < h - 1; y++) {
          for (x = 1; x < w - 1; x++) {
            o = (y * w + x) * 4;
            c = pack(o);
            edge = pack(o + 4) !== c || pack(((y + 1) * w + x) * 4) !== c;
            if (fillVeryDark) {
              lum = 0.299 * d[o] + 0.587 * d[o + 1] + 0.114 * d[o + 2];
              if (lum < 42) edge = true;
            }
            if (edge) out[y * w + x] = 0;
          }
        }
        var thick = new Uint8ClampedArray(out);
        for (y = 1; y < h - 1; y++) {
          for (x = 1; x < w - 1; x++) {
            if (out[y * w + x] > 32) continue;
            thick[y * w + x - 1] = 0;
            thick[y * w + x + 1] = 0;
            thick[(y - 1) * w + x] = 0;
            thick[(y + 1) * w + x] = 0;
          }
        }
        for (i = 0; i < w * h; i++) {
          var v = thick[i];
          d[i * 4] = v;
          d[i * 4 + 1] = v;
          d[i * 4 + 2] = v;
          d[i * 4 + 3] = 255;
        }
        ox.putImageData(data, 0, 0);
        return off;
      }

      function cartoonToColoring(im) {
        return posterizeToColoring(im, {
          maxSide: 960,
          step: 36,
          fillVeryDark: true,
          blurPasses: 1
        });
      }

      function photoToLocalColoring(im) {
        return posterizeToColoring(im, {
          maxSide: 720,
          step: 48,
          fillVeryDark: false,
          blurPasses: 4
        });
      }

      function firstInlineImage(json) {
        var cands = json && json.candidates;
        if (!Array.isArray(cands)) return null;
        for (var i = 0; i < cands.length; i++) {
          var content = cands[i] && cands[i].content;
          var parts = content && content.parts;
          if (!Array.isArray(parts)) continue;
          for (var p = 0; p < parts.length; p++) {
            var inline = parts[p] && (parts[p].inlineData || parts[p].inline_data);
            var data = inline && inline.data;
            if (data) {
              var mime = (inline.mimeType || inline.mime_type || 'image/png').toString();
              if (mime.indexOf('image/') !== 0) mime = 'image/png';
              return 'data:' + mime + ';base64,' + data;
            }
          }
        }
        return null;
      }

      function photoToCartoon(jpegB64, aspect) {
        var ac = new AbortController();
        var timer = setTimeout(function () { ac.abort(); }, 25000);
        return fetch(SUPABASE_URL + '/functions/v1/gemini-proxy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_ANON,
            Authorization: 'Bearer ' + SUPABASE_ANON
          },
          body: JSON.stringify({
            generateImage: true,
            model: 'gemini-3.1-flash-image',
            prompt: CARTOON_PROMPT,
            imageBase64: jpegB64,
            mimeType: 'image/jpeg',
            generationConfig: {
              responseModalities: ['IMAGE'],
              imageConfig: { imageSize: '1K', aspectRatio: aspect || '1:1' }
            }
          }),
          signal: ac.signal
        }).then(function (res) {
          return res.text().then(function (text) {
            var json = {};
            try { json = text ? JSON.parse(text) : {}; } catch (_) {}
            if (!res.ok) {
              throw new Error('gemini ' + res.status);
            }
            var src = firstInlineImage(json);
            if (!src) throw new Error('no image');
            return src;
          });
        }).finally(function () {
          clearTimeout(timer);
        });
      }

      function applyLineArt(canvasArt, note) {
        lineArt = canvasArt;
        resizeCanvas(paint, pctx, true);
        drawLineArt();
        if (note) {
          setBusy(true, note, false);
          setTimeout(function () { setBusy(false, '', false); }, 3200);
        } else {
          setBusy(false, '', false);
        }
      }

      function localFromJpegB64(jpegB64) {
        setBusy(true, 'Basit boyama kalıbı hazırlanıyor…', false);
        return loadImageSrc('data:image/jpeg;base64,' + jpegB64).then(function (im) {
          return photoToLocalColoring(im);
        });
      }

      function convertJpeg(jpegB64, aspect) {
        setBusy(true, 'Çizgi filme çevriliyor…', false);
        return photoToCartoon(jpegB64, aspect)
          .then(function (src) {
            setBusy(true, 'Boyama sayfası hazırlanıyor…', false);
            return loadImageSrc(src).then(function (im) {
              applyLineArt(cartoonToColoring(im), null);
            });
          })
          .catch(function () {
            return localFromJpegB64(jpegB64)
              .then(function (art) {
                applyLineArt(
                  art,
                  'Çizgi film servisi kullanılamadı; basit kalıp hazırlandı.'
                );
              })
              .catch(function () {
                setBusy(
                  true,
                  'Resim eklenemedi. JPEG veya PNG dene.',
                  true
                );
              });
          });
      }

      document.getElementById('pick').addEventListener('click', function () {
        if (busy && !document.getElementById('busy').classList.contains('error')) return;
        document.getElementById('photo').click();
      });

      document.getElementById('busy-retry').addEventListener('click', function () {
        if (!lastJpeg) return;
        convertJpeg(lastJpeg, lastAspect);
      });

      document.getElementById('photo').addEventListener('change', function (e) {
        var file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setBusy(true, 'Fotoğraf okunuyor…', false);
        fileToJpeg(file)
          .then(function (prep) {
            lastJpeg = prep.b64;
            lastAspect = prep.aspect;
            return convertJpeg(prep.b64, prep.aspect);
          })
          .catch(function () {
            setBusy(
              true,
              'Resim eklenemedi. JPEG veya PNG dene.',
              true
            );
          });
      });
    })();
  </script>
</body>
</html>
