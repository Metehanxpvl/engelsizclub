<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="description" content="Engelsiz Boyama — Engelsiz Club boyama sayfası." />
  <title>Engelsiz Boyama — Engelsiz Club</title>
  <style>
    :root {
      --fg: #0f2f24;
      --muted: #5a7168;
      --bg: #f4faf7;
      --card: #ffffff;
      --accent: #1a6b4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 16px 8px;
      text-align: center;
    }
    header a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }
    h1 {
      margin: 6px 0 4px;
      font-size: 1.35rem;
      color: var(--accent);
    }
    .sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
    }
    .swatch, .size, button {
      border: 2px solid transparent;
      border-radius: 999px;
      cursor: pointer;
    }
    .swatch {
      width: 36px;
      height: 36px;
    }
    .swatch.active { border-color: var(--fg); }
    .size {
      width: 32px;
      height: 32px;
      background: #fff;
      color: var(--fg);
      font-weight: 800;
      font-size: 0.75rem;
    }
    .size.active { border-color: var(--accent); color: var(--accent); }
    button.action {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 10px;
    }
    #wrap {
      flex: 1;
      min-height: 0;
      padding: 0 12px 16px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      touch-action: none;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">← Engelsiz Club</a>
    <h1>🎨 Engelsiz Boyama</h1>
    <p class="sub">Rengi seç, parmağınla boya.</p>
  </header>
  <div class="tools" id="tools">
    <button type="button" class="swatch active" data-color="#1a6b4a" style="background:#1a6b4a" aria-label="Yeşil"></button>
    <button type="button" class="swatch" data-color="#e07a5f" style="background:#e07a5f" aria-label="Turuncu"></button>
    <button type="button" class="swatch" data-color="#5b8dd9" style="background:#5b8dd9" aria-label="Mavi"></button>
    <button type="button" class="swatch" data-color="#f4a832" style="background:#f4a832" aria-label="Sarı"></button>
    <button type="button" class="swatch" data-color="#9c6db3" style="background:#9c6db3" aria-label="Mor"></button>
    <button type="button" class="swatch" data-color="#111111" style="background:#111" aria-label="Siyah"></button>
    <button type="button" class="swatch" data-color="#ffffff" style="background:#fff;border-color:#ccc" aria-label="Silgi"></button>
    <button type="button" class="size active" data-size="8">S</button>
    <button type="button" class="size" data-size="18">M</button>
    <button type="button" class="size" data-size="32">L</button>
    <button type="button" class="action" id="clear">Temizle</button>
  </div>
  <div id="wrap"><canvas id="c" aria-label="Boyama alanı"></canvas></div>
  <script>
    (function () {
      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var color = '#1a6b4a';
      var size = 8;
      var drawing = false;

      function resize() {
        var wrap = document.getElementById('wrap');
        var r = wrap.getBoundingClientRect();
        var dpr = Math.max(1, window.devicePixelRatio || 1);
        canvas.width = Math.floor(r.width * dpr);
        canvas.height = Math.floor(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }
      resize();
      window.addEventListener('resize', resize);

      function pos(e) {
        var r = canvas.getBoundingClientRect();
        var t = e.touches ? e.touches[0] : e;
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }
      function start(e) {
        drawing = true;
        var p = pos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        e.preventDefault();
      }
      function move(e) {
        if (!drawing) return;
        var p = pos(e);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        e.preventDefault();
      }
      function end() { drawing = false; }

      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointerleave', end);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', end);

      document.getElementById('tools').addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.color) {
          color = btn.dataset.color;
          document.querySelectorAll('.swatch').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        } else if (btn.dataset.size) {
          size = Number(btn.dataset.size);
          document.querySelectorAll('.size').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
        }
      });
      document.getElementById('clear').addEventListener('click', function () {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        resize();
      });
    })();
  </script>
</body>
</html>
