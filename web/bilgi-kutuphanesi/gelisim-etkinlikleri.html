    function buildActivities() {
      const list = [];
      for (const [gkey, gname] of GROUPS) {
        IDEAS[gkey].forEach((row, idx) => {
          const age = AGES[idx % AGES.length];
          const lvl = LEVELS[idx % LEVELS.length];
          list.push({
            id: list.length + 1,
            baslik: row[0],
            aciklama: row[1],
            ipucu: row[2],
            grup: gkey,
            grupAd: gname,
            yas: age[0],
            yasAd: age[1],
            zorluk: lvl[0],
            zorlukAd: lvl[1],
            youtube: YT_BY_GROUP[gkey] || '',
          });
        });
      }
      while (list.length < 120) {
        const b = list[list.length % 119];
        list.push({
          ...b,
          id: list.length + 1,
          baslik: b.baslik + ' · Ek pratik',
          aciklama: b.aciklama + ' Bu turda süreyi biraz uzatın.',
        });
      }
      return list.slice(0, 120).map((a, i) => ({ ...a, id: i + 1 }));
    }

    function extractYtId(raw) {
      const s = (raw || '').trim();
      if (!s) return '';
      if (/^[\w-]{11}$/.test(s)) return s;
      try {
        const u = new URL(s);
        const v = u.searchParams.get('v');
        if (v && v.length >= 11) return v.slice(0, 11);
        const parts = u.pathname.split('/').filter(Boolean);
        for (let i = 0; i < parts.length; i++) {
          if ((parts[i] === 'embed' || parts[i] === 'shorts' || parts[i] === 'v') && parts[i + 1]) {
            return parts[i + 1].slice(0, 11);
          }
        }
        if (u.hostname.includes('youtu.be') && parts[0]) return parts[0].slice(0, 11);
      } catch (_) {}
      return '';
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function cardHtml(a) {
      const ytId = extractYtId(a.youtube || a.youtube_url || '');
      const yt = ytId
        ? '<div class="yt-facade" data-yt="' + ytId + '" role="button" tabindex="0" aria-label="Videoyu yükle"></div>'
        : '';
      const kaynak = (a.kaynak || '').trim()
        ? '<p class="kaynak"><strong>Kaynak:</strong> ' + escapeHtml(a.kaynak) + '</p>'
        : '';
      return (
        '<article class="card" data-id="' + a.id + '">' +
          '<div class="tags">' +
            '<span class="chip">' + escapeHtml(a.grupAd) + '</span>' +
            '<span class="chip">' + escapeHtml(a.yasAd) + '</span>' +
            '<span class="chip">' + escapeHtml(a.zorlukAd) + '</span>' +
          '</div>' +
          '<h2>' + escapeHtml(a.baslik) + '</h2>' +
          '<p>' + escapeHtml(a.aciklama) + '</p>' +
          '<p class="tip">İpucu: ' + escapeHtml(a.ipucu) + '</p>' +
          yt +
          kaynak +
        '</article>'
      );
    }

    function mapRow(r) {
      return {
        id: r.id,
        baslik: r.title,
        aciklama: r.description,
        ipucu: r.tip,
        grup: r.grup,
        grupAd: r.grup_ad,
        yas: r.yas,
        yasAd: r.yas_ad,
        zorluk: r.zorluk,
        zorlukAd: r.zorluk_ad,
        youtube: r.youtube_url || '',
        kaynak: r.kaynak || '',
      };
    }

    const SUPABASE_URL = 'https://qycrkqwqrysypvqaipqn.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_N7UfnXDF97YsuDTsFTq9zQ_lhnNtMgF';

    async function loadFromSupabase() {
      const url = SUPABASE_URL + '/rest/v1/gelisim_etkinlikleri?select=*&is_active=eq.true&order=sort_order.asc,id.asc';
      const res = await fetch(url, {
        headers: {
          apikey: SUPABASE_ANON,
          Authorization: 'Bearer ' + SUPABASE_ANON,
        },
      });
      if (!res.ok) throw new Error('supabase ' + res.status);
      const rows = await res.json();
      if (!Array.isArray(rows) || !rows.length) throw new Error('empty');
      return rows.map(mapRow);
    }

    let ALL = buildActivities();
    const PAGE = 12;
    let filtered = ALL.slice();
    let shown = 0;
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('count');
    const ytObserver = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        const el = en.target;
        ytObserver.unobserve(el);
        const id = el.getAttribute('data-yt');
        if (!id) return;
        const img = new Image();
        img.alt = '';
        img.loading = 'lazy';
        img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
        el.appendChild(img);
        const play = document.createElement('div');
        play.className = 'play';
        play.textContent = '▶ Videoyu izle';
        el.appendChild(play);
        el.addEventListener('click', () => {
          el.innerHTML = '';
          const iframe = document.createElement('iframe');
          iframe.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
          iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
          iframe.allowFullscreen = true;
          iframe.loading = 'lazy';
          iframe.title = 'YouTube video';
          el.appendChild(iframe);
        }, { once: true });
      });
    }, { rootMargin: '200px' });

    function applyFilters() {
      const q = (document.getElementById('q').value || '').trim().toLocaleLowerCase('tr');
      const yas = document.getElementById('f-yas').value;
      const grup = document.getElementById('f-grup').value;
      const zorluk = document.getElementById('f-zorluk').value;
      filtered = ALL.filter((a) => {
        if (yas && a.yas !== yas) return false;
        if (grup && a.grup !== grup) return false;
        if (zorluk && a.zorluk !== zorluk) return false;
        if (!q) return true;
        const hay = (a.baslik + ' ' + a.aciklama + ' ' + a.grupAd + ' ' + a.ipucu + ' ' + (a.kaynak || '')).toLocaleLowerCase('tr');
        return hay.includes(q);
      });
      shown = 0;
      grid.innerHTML = '';
      countEl.textContent = filtered.length + ' etkinlik';
      if (!filtered.length) {
        grid.innerHTML = '<div class="empty">Filtreye uyan etkinlik yok. Arama/filtreleri sıfırlayın.</div>';
        return;
      }
      loadMore();
    }

    function loadMore() {
      if (shown >= filtered.length) return;
      const slice = filtered.slice(shown, shown + PAGE);
      const wrap = document.createElement('div');
      wrap.innerHTML = slice.map(cardHtml).join('');
      [...wrap.children].forEach((node) => {
        grid.appendChild(node);
        const yt = node.querySelector('.yt-facade');
        if (yt) ytObserver.observe(yt);
      });
      shown += slice.length;
    }

    const moreObserver = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) loadMore();
    }, { rootMargin: '400px' });
    moreObserver.observe(document.getElementById('sentinel'));

    ['q', 'f-yas', 'f-grup', 'f-zorluk'].forEach((id) => {
      document.getElementById(id).addEventListener('input', applyFilters);
      document.getElementById(id).addEventListener('change', applyFilters);
    });

    /* Header / footer include (statik) */
    async function inject(sel, url) {
      const host = document.querySelector(sel);
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('fail');
        host.innerHTML = await res.text();
      } catch (_) {
        if (sel === '#site-header') {
          host.innerHTML = '<header class="site-header"><a class="brand" href="/">← Engelsiz Club · Bilgi Kütüphanesi</a></header>';
        } else {
          host.innerHTML = '<footer class="site-footer"><p>Engelsiz Club</p></footer>';
        }
      }
    }

    async function loadDahaFazlasiMenu() {
      const menu = document.getElementById('daha-fazlasi-menu');
      const toggle = document.querySelector('.dropdown-toggle');
      if (!menu || !toggle) return;
      let items = [];
      try {
        const res = await fetch('/admin/daha_fazlasi_menu.json');
        if (res.ok) items = await res.json();
      } catch (_) {}
      if (!Array.isArray(items) || !items.length) {
        items = [{ id: 1, isim: 'Gelişim Etkinlikleri', link: '/bilgi-kutuphanesi/gelisim-etkinlikleri.html', aktif: 1 }];
      }
      menu.innerHTML = items
        .filter((x) => Number(x.aktif) === 1)
        .map((x) => '<li><a href="' + x.link + '">' + x.isim + '</a></li>')
        .join('');
      toggle.addEventListener('click', () => {
        const open = menu.hasAttribute('hidden');
        if (open) menu.removeAttribute('hidden');
        else menu.setAttribute('hidden', '');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }

    Promise.all([
      inject('#site-header', 'includes/header.html'),
      inject('#site-footer', 'includes/footer.html'),
    ]).then(loadDahaFazlasiMenu);

    loadFromSupabase()
      .then((rows) => {
        ALL = rows;
        applyFilters();
      })
      .catch(() => {
        applyFilters();
      });
  </script>
</body>
</html>
