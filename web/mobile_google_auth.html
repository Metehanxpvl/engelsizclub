<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Engelsiz Club — Google Giriş</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f3d2e; color: #fff;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { opacity: .85; font-size: .95rem; line-height: 1.4; }
    #gis { display: flex; justify-content: center; margin-top: 18px; min-height: 44px; }
    button.cancel {
      margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 12px;
      background: transparent; color: #fff; font-weight: 600; font-size: 14px;
      text-decoration: underline; cursor: pointer;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="card">
    <h1>Google ile giriş</h1>
    <p id="msg">Hesabınızı seçin</p>
    <div id="gis"></div>
    <button class="cancel" id="btn" type="button">Vazgeç</button>
  </div>

  <script>
    var APP_SCHEME = 'io.supabase.engelsizclub://login-callback';
    var CLIENT_ID =
      '59695056324-3dk4r1lsht7n5agn811vjj9777l0qdce.apps.googleusercontent.com';
    var done = false;

    function setMsg(t) { document.getElementById('msg').textContent = t; }

    function goApp(params) {
      if (done) return;
      done = true;
      var q = [];
      Object.keys(params).forEach(function (k) {
        if (params[k] != null && params[k] !== '') {
          q.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k])));
        }
      });
      window.location.href = APP_SCHEME + '#' + q.join('&');
    }

    function finishWithIdToken(idToken) {
      if (!idToken) {
        setMsg('Kimlik jetonu alınamadı. Tekrar deneyin.');
        return;
      }
      setMsg('Uygulamaya dönülüyor…');
      goApp({ id_token: idToken });
    }

    function waitGoogle(ms) {
      return new Promise(function (resolve, reject) {
        function ready() {
          return window.google && google.accounts && google.accounts.id;
        }
        if (ready()) { resolve(); return; }
        var started = Date.now();
        var id = setInterval(function () {
          if (ready()) { clearInterval(id); resolve(); }
          else if (Date.now() - started > (ms || 8000)) {
            clearInterval(id);
            reject(new Error('Google giriş kütüphanesi yüklenemedi.'));
          }
        }, 40);
      });
    }

    document.getElementById('btn').onclick = function () {
      goApp({ cancelled: '1' });
    };

    waitGoogle(8000).then(function () {
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: function (response) {
          if (response && response.credential) {
            finishWithIdToken(response.credential);
          } else {
            setMsg('Google kimlik jetonu alınamadı. Tekrar deneyin.');
          }
        },
        auto_select: false,
        context: 'signin',
        ux_mode: 'popup',
        itp_support: true,
        use_fedcm_for_prompt: true
      });
      google.accounts.id.renderButton(document.getElementById('gis'), {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'pill',
        locale: 'tr',
        width: 280
      });
      try {
        google.accounts.id.prompt();
      } catch (_) {}
    }).catch(function (e) {
      setMsg((e && e.message) ? e.message : 'Google yüklenemedi. Sayfayı yenileyin.');
    });
  </script>
</body>
</html>
